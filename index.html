<script>
/* ===== game.js ===== */
/* Rune Clash — çekirdek döngü prototipi
 *
 * Test ettiğimiz tek soru: kart çevirip saldırı tetiklemek gergin ve tatmin edici mi?
 * Kurallar için bkz. docs/fikirler.md
 */

/* ---------------- ayarlanabilir sayılar ---------------- */

const CFG = {
  maxHp:        35,
  // Tahta: 6 elementin 5'i çıkar, 8 çift eşitsiz dağıtılır (3 element 2'şer,
  // 2 element 1'er) = 16 kart. Şans "var mı yok mu" değil "kaç tane var".
  boardElements: 5,
  boardPairs:    8,
  elemBase:      1,    // her elementin taban çekiliş ağırlığı
  elemBias:      3,    // destende olan elemente eklenen ağırlık (oyuncu VE rakip)
  maxChain:     3,     // aynı taraf üst üste en fazla kaç hasarlı eşleşme yapabilir

  // aiRecall tek başına tüm zorluk kadranı — 60'ar maçlık simülasyonla ölçüldü.
  // Ortalama bir oyuncuya karşı kazanma oranın: 0.35 → %58 | 0.45 → %35 | 0.55 → %22 | 0.78 → %10
  aiRecall:     0.35,  // AI açılan bir kartı hatırlama olasılığı
  aiForget:     0.12,  // her turda bir anıyı unutma olasılığı
  aiDenyChance: 0.55,  // işine yaramayan ama oyuncunun işine yarayan çifti alma eğilimi
                       // (ölçüldü: dengeye etkisi ihmal edilebilir, his için duruyor)

  // süreler (ms) — hepsi burada, böylece 0'a çekip hızlı simülasyon koşabiliyoruz
  // Kaçırınca ikinci kartı okumak için zaman gerekiyor; tutturunca gerekmiyor —
  // tuttuğunu kart döner dönmez görüyorsun. Eşleşme daha çabuk ödüllendirilmeli.
  flipPeek:     430,   // eşleşMEyen kartların açık kaldığı süre
  matchPeek:    170,   // eşleşenlerin birleşmeye başlamadan önceki anı
  aiThink:      520,   // AI'ın "düşünme" duraklaması
  mergeFlight:  300,   // eşleşen iki kartın kalkıp birleşmesi
  mergePop:     130,   // saldırı başlamadan önceki an
  mergeGlyph:   560,   // doğan rune'un oluş–dur–dağıl süresi
                       // (mergePop'tan uzun: rune saldırı başlarken dağılmaya devam eder)
  // Tek vuruşun toplam süresi ≈ spellCast + lunge + spellTravel + hitHold.
  // Bir eşleşmede 2 karakter saldırabiliyor, bir maçta ~23 eşleşme var —
  // buradaki her 50ms, maç başına ~2 saniyeye dönüşüyor. Cömert davranma.
  spellCast:    120,   // büyü öncesi hazırlık (her element kendi çarpanını uygular)
  spellTravel:  280,   // merminin yol alma süresi (elemente göre 0.34x–1.0x)
  spellImpact:  240,   // çarpma efektinin süresi
  lunge:         90,   // saldıranın geri tepmesi
  hitHold:      180,   // vuruş sarsıntısının kalma süresi
  boardSwap:    480,   // tahta yenilenmeden önceki bekleme

  // kart dağıtımı — boş tahta bir an görünsün, sonra kartlar hızlıca yerlerine
  dealDelay:    200,   // dağıtımdan önce boş grid'in görüldüğü an
  dealCard:     360,   // tek kartın uçuş süresi
  dealStagger:   26,   // kartlar arası gecikme (16 kart ≈ 980ms toplam)
};

// CFG içindeki tüm süre alanları — hızlı simülasyon bunları sıfırlar
const TIMING_KEYS = [
  'flipPeek', 'matchPeek', 'aiThink', 'mergeFlight', 'mergePop', 'mergeGlyph',
  'spellCast', 'spellTravel', 'spellImpact',
  'lunge', 'hitHold', 'boardSwap',
  'dealDelay', 'dealCard', 'dealStagger',
];

const DEFAULT_TIMINGS = Object.fromEntries(TIMING_KEYS.map((k) => [k, CFG[k]]));

/** fastMode(true) → tüm animasyonlar kapanır, denge simülasyonu anında koşar. */
function fastMode(on) {
  for (const k of TIMING_KEYS) CFG[k] = on ? 0 : DEFAULT_TIMINGS[k];
}

const ELEMENTS = {
  fire:   { name: 'Ateş',     color: 'var(--fire)'   },
  ice:    { name: 'Buz',      color: 'var(--ice)'    },
  bolt:   { name: 'Yıldırım', color: 'var(--bolt)'   },
  nature: { name: 'Doğa',     color: 'var(--nature)' },
  wind:   { name: 'Rüzgar',   color: 'var(--wind)'   },
  arcane: { name: 'Kadim',    color: 'var(--arcane)' },
};

/* Element sembolleri.
 *
 * Önce runik alfabe harfleri kullanılıyordu — ama bunlar bir alfabe değil,
 * elementleri temsil eden işaretler. Ateş harfi değil, ateş olmalı.
 *
 * Altısı da 14px'te (filtre çipi) ayırt edilebiliyor; siluetleri kasten farklı:
 * damla · yıldız · zikzak · yaprak · yatay akış · daire.
 */
const ELEMENT_ART = {
  fire: `<path d="M50 8 C64 30 80 42 80 60 A30 30 0 0 1 20 60 C20 45 31 39 37 25 C41 39 47 45 51 41 C57 33 54 19 50 8 Z"/>
         <path d="M50 48 C57 60 62 66 62 73 A12 12 0 0 1 38 73 C38 66 43 60 50 48 Z" fill="currentColor" stroke="none"/>`,

  ice: [0, 60, 120, 180, 240, 300]
    .map((a) => `<g transform="rotate(${a} 50 50)"><path d="M50 50 L50 9"/><path d="M50 25 L41 16"/><path d="M50 25 L59 16"/></g>`)
    .join(''),

  bolt: `<path d="M58 6 L28 52 L47 52 L40 94 L72 44 L52 44 Z" fill="currentColor" stroke="none"/>`,

  nature: `<path d="M50 92 C18 70 16 34 50 8 C84 34 82 70 50 92 Z"/>
           <path d="M50 88 L50 22"/>
           <path d="M50 42 L33 32"/><path d="M50 42 L67 32"/>
           <path d="M50 62 L35 54"/><path d="M50 62 L65 54"/>`,

  wind: `<path d="M12 32 H52 C64 32 64 17 53 20"/>
         <path d="M12 52 H66 C80 52 80 71 65 67"/>
         <path d="M12 72 H42 C52 72 52 84 44 81"/>`,

  arcane: `<circle cx="50" cy="50" r="37"/>
           <path d="M50 26 C53 43 57 47 74 50 C57 53 53 57 50 74 C47 57 43 53 26 50 C43 47 47 43 50 26 Z" fill="currentColor" stroke="none"/>`,
};

// Oyuncunun takımı koleksiyondan kurulur — bkz. champions.js / playerSquad().
// Rakip her maçta üretilir ve gücü oyuncununkine eşitlenir (bkz. makeFoe).

/* ---------------- yardımcılar ---------------- */

const $ = (sel, root = document) => root.querySelector(sel);
// süre 0 ise mikrogöreve düşer — böylece CFG süreleri sıfırlanınca
// simülasyon tarayıcının 4ms setTimeout tabanına takılmadan koşar
const sleep = (ms) => (ms > 0 ? new Promise((r) => setTimeout(r, ms)) : Promise.resolve());
const other = (side) => (side === 'player' ? 'ai' : 'player');
const sideName = (side) => (side === 'player' ? 'Sen' : S.foe.name);

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Her ikon TAM bir SVG dizesi olarak tutuluyor. Böylece kullanıcı
 * src/assets/icons/<ad>.svg koyunca dizeyi bütün olarak değiştirebiliyoruz —
 * kendi viewBox'ı, kendi çizgi kalınlığı geçerli oluyor. Bkz. loadIcons(). */
const ICON_SVG = {};
for (const [el, art] of Object.entries(ELEMENT_ART)) {
  ICON_SVG[el] = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
    stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">${art}</svg>`;
}

const elemIcon = (el) => ICON_SVG[el];

// Kart arkası — tüm kartlarda aynı, gerçek bir deste gibi.
// `let`: assets/icons/rune-mark.svg varsa onunla değiştiriliyor.
let CARD_BACK_SVG = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
  stroke-linecap="round" stroke-linejoin="round">
  <path d="M50 8 L88 50 L50 92 L12 50 Z" stroke-width="4"/>
  <path d="M50 24 L72 50 L50 76 L28 50 Z" stroke-width="3" opacity=".65"/>
  <path d="M50 38 L61 50 L50 62 L39 50 Z" fill="currentColor" stroke="none" opacity=".5"/>
  <path d="M50 2 L50 8 M50 92 L50 98 M2 50 L12 50 M88 50 L98 50" stroke-width="3" opacity=".5"/>
</svg>`;

/** Bir rune kartının iki yüzü: kapalı arka + açık ön. */
function cardHtml(el, i) {
  const e = ELEMENTS[el];
  return `
    <button class="card" data-i="${i}" style="--c:${e.color}">
      <span class="card-inner">
        <span class="face cover">
          <span class="cv-mark">${CARD_BACK_SVG}</span>
        </span>
        <span class="face rune">
          <span class="rn-pip">${elemIcon(el)}</span>
          <span class="rn-art">${elemIcon(el)}</span>
          <span class="rn-name">${e.name}</span>
        </span>
      </span>
    </button>`;
}

/* ---------------- durum ---------------- */

let S;

// app.js savaş bitince bunu çağırır: onBattleEnd('player' | 'ai')
let onBattleEnd = () => {};

/** Bir maç başlatır. foe: {name, level, rank, units:[{id,name,el,atk}]} */
function startBattle(foe, onEnd) {
  onBattleEnd = onEnd || (() => {});

  const mine = playerSquad();

  S = {
    round: 1,
    turn: 'player',
    chain: 0,                        // sıradaki tarafın üst üste kaçıncı hasarlı eşleşmesi
    busy: false,
    over: null,
    flipped: [],
    foe,
    board: makeBoard([mine, foe.units]),   // tahta iki tarafın elementlerini bilerek kurulur
    aiMem: {},                       // kart indeksi -> element (AI'ın kusurlu hafızası)
    teams: {
      player: mine.map((c)      => ({ ...c, hp: CFG.maxHp, burn: null })),
      ai:     foe.units.map((c) => ({ ...c, hp: CFG.maxHp, burn: null })),
    },
    ...freshSkillState(),          // şarj barları ve bekleyen etkiler (skills.js)
  };

  $('#log').innerHTML = '';
  $('#foeName').textContent = foe.name;
  $('#foeMeta').textContent = `${foe.rank} · Sv ${foe.level}`;
  $('#foeAvatar').textContent = foe.name[0].toUpperCase();
  $('#foeAvatar').style.setProperty('--c', ELEMENTS[foe.units[0].el].color);

  buildTeams();
  syncHeader();
  syncSkills();
  addLog('Bir rune çifti bul — o elementteki karakterlerin saldırsın.', 'sys');

  // kartlar dağıtılırken tıklama kapalı
  const dealMs = buildBoard();
  if (dealMs > 0) {
    const inst = S;
    S.busy = true;
    setTimeout(() => { if (S === inst) S.busy = false; }, dealMs);
  }
}

/** Ağırlıklı, tekrarsız çekiliş: listeden n tane seçer. */
function weightedSample(list, weight, n) {
  const pool = [...list];
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((s, el) => s + weight[el], 0);
    let r = Math.random() * total;
    let i = 0;
    while (i < pool.length - 1 && (r -= weight[pool[i]]) > 0) i++;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

/**
 * Tahta kurulumu.
 *
 * 6 elementin `boardElements` kadarı çıkar ve `boardPairs` çift aralarında
 * EŞİTSİZ dağıtılır — bazı elementler 2 çift, bazıları 1 çift alır.
 *
 * Neden böyle: önce 4 element × 2 çift vardı ve sana sadece bir element
 * garantiliydi. Destendeki diğer elementlerin tahta başına şansı ~2/3'tü, yani
 * üst üste iki tur kaçırmak %11 ihtimalle oluyordu — ve kötü hissettiriyordu.
 * Şimdi şans "var mı yok mu" ikiliği değil, "kaç çifti var" gradyanı.
 *
 * Her iki tarafın elementleri hem SEÇİLMEKTE hem de ÇİFT ALMAKTA ağırlıklı;
 * garanti değil, sadece daha olası.
 *
 * @param sides [oyuncuKadrosu, rakipKadrosu]
 */
function makeBoard(sides = []) {
  const all = Object.keys(ELEMENTS);
  const weight = Object.fromEntries(all.map((el) => [el, CFG.elemBase]));

  for (const units of sides) {
    const alive = units.filter((u) => u.hp === undefined || u.hp > 0);
    for (const el of new Set(alive.map((u) => u.el))) weight[el] += CFG.elemBias;
  }

  // 1) her tarafa en az bir element — tamamen ölü tahtaya karşı taban güvence
  const picked = [];
  for (const units of sides) {
    const alive = units.filter((u) => u.hp === undefined || u.hp > 0);
    const own = shuffle([...new Set(alive.map((u) => u.el))]);
    const need = own.find((el) => !picked.includes(el));
    if (need && picked.length < CFG.boardElements) picked.push(need);
  }

  // 2) kalan yerler ağırlıklı çekilişle
  picked.push(
    ...weightedSample(all.filter((el) => !picked.includes(el)), weight,
                      CFG.boardElements - picked.length)
  );

  // 3) çiftleri dağıt: herkese 1, artanları ağırlıklı olarak ikinci çifte
  const pairs = Object.fromEntries(picked.map((el) => [el, 1]));
  const extra = CFG.boardPairs - picked.length;
  for (const el of weightedSample(picked, weight, extra)) pairs[el] = 2;

  const cards = [];
  for (const [el, n] of Object.entries(pairs)) {
    for (let i = 0; i < n * 2; i++) cards.push(el);
  }
  return shuffle(cards).map((el) => ({ el, up: false, matched: false }));
}

/* ---------------- DOM kurulumu ---------------- */

function buildTeams() {
  for (const side of ['player', 'ai']) {
    const host = $(side === 'player' ? '#playerTeam' : '#aiTeam');
    host.innerHTML = S.teams[side]
      .map(
        (c) => `
      <div class="unit" id="u-${c.id}" style="--c:${ELEMENTS[c.el].color}">
        <div class="row1">
          <span class="glyph">${elemIcon(c.el)}</span>
          <span class="name">${c.name}</span>
          <span class="atk">${c.atk}</span>
        </div>
        <div class="hpbar"><div class="hpfill"></div></div>
        <div class="hptext"></div>
      </div>`
      )
      .join('');
  }
  syncTeams();
}

/** Tahtayı kurar ve kartları dağıtır. Dağıtımın toplam süresini (ms) döndürür. */
function buildBoard() {
  // Yuvalar hep duruyor: kartlar gelmeden önce nereye geleceklerini gösteriyorlar,
  // kartlar kalktıktan sonra da yerin boşaldığını.
  $('#board').innerHTML = S.board
    .map((c, i) => `<span class="slot">${cardHtml(c.el, i)}</span>`)
    .join('');
  syncBoard();
  return dealBoard();
}

const cardNode = (i) => $(`.card[data-i="${i}"]`, $('#board'));

/* ---------------- ekrana yansıtma ---------------- */

function syncBoard() {
  const cards = $('#board').querySelectorAll('.card');
  S.board.forEach((c, i) => {
    // `shown`: Kasırga'nın açtığı kart. Çevrilmiş sayılmıyor (hâlâ seçilebilir)
    // ama yüzü açık duruyor — eşleşene kadar öyle kalıyor.
    cards[i].classList.toggle('up', c.up || !!c.shown);
    cards[i].classList.toggle('shown', !!c.shown && !c.up);
    cards[i].classList.toggle('matched', c.matched);
  });
}

function syncTeams() {
  for (const side of ['player', 'ai']) {
    for (const c of S.teams[side]) {
      const el = $('#u-' + c.id);
      const pct = (c.hp / CFG.maxHp) * 100;
      $('.hpfill', el).style.width = pct + '%';
      $('.hptext', el).textContent = c.hp + ' / ' + CFG.maxHp;
      el.classList.toggle('low', pct <= 35);
      el.classList.toggle('dead', c.hp === 0);
    }
  }
}

function syncHeader() {
  $('#roundNo').textContent = S.round;
  const b = $('#turnBanner');
  const mine = S.turn === 'player';
  b.textContent = mine ? 'Senin sıran' : 'Rakip düşünüyor…';
  b.className = mine ? 'turn-player' : 'turn-ai';
}

/* ---------------- yetenek barı ---------------- */

function syncSkills() {
  for (const [side, sel] of [['player', '#myCharge'], ['ai', '#foeCharge']]) {
    const node = $(sel);
    if (!node) continue;
    const c = S.skill[side];
    const el = c.el || (S.teams[side].find((u) => u.hp > 0) || {}).el || 'arcane';
    const renk = ELEMENTS[el] ? ELEMENTS[el].color : 'var(--muted)';
    const s = c.el ? SKILLS[c.el] : null;

    const gerek = chargeNeed(side);        // deste şekline göre değişiyor
    node.style.setProperty('--c', renk);
    node.classList.toggle('ready', c.hazir);
    node.innerHTML =
      Array.from({ length: gerek }, (_, i) =>
        `<i class="${i < c.sarj ? 'on' : ''}"></i>`).join('') +
      `<span class="charge-txt">${c.hazir && s
        ? (side === 'player' ? `${s.ad} — kullan` : `${s.ad} hazır`)
        : `${c.sarj}/${gerek}`}</span>`;

    // Etkin durumlar rozet olarak: oyuncu neyin açık olduğunu görsün.
    const e = S.effects[side];
    const rozet = [];
    if (e.frozen) rozet.push('donmuş');
    if (e.spare)  rozet.push(`sağanak ${e.spare}`);
    if (e.echo)   rozet.push(`yankı ×${e.echo}`);
    if (rozet.length) node.innerHTML += `<span class="charge-tag">${rozet.join(' · ')}</span>`;
  }
  if ($('#myCharge')) $('#myCharge').disabled = !(S.skill.player.hazir && S.turn === 'player' && !S.busy && !S.over);
}

/** Yeteneği kullanır ve görsel karşılığını oynatır. */
async function useSkill(side) {
  if (!skillReady(side) || S.over) return;
  const r = castSkill(side);
  if (!r) return;

  addLog(`${sideName(side)}: ${r.ad}${r.guclu ? ' (güçlü)' : ''}!`, side);
  syncSkills(); syncTeams(); syncBoard();

  // Kasırga (rüzgar) tahtaya dokunuyor, burada oynatılıyor.
  const kacCift = S.effects[side].peek;
  if (kacCift > 0) {
    S.effects[side].peek = 0;
    for (let k = 0; k < kacCift; k++) revealOwnPair(side);
  }

  checkOver();
  syncHeader();
}

/**
 * Kasırga: destendeki bir elementin çiftini KALICI açar — eşleşene kadar
 * açık kalıyor.
 *
 * Önce süreli bir bakıştı. İki sorunu vardı: oyuncu ezberleyemezse boşa
 * gidiyordu (bitirici boşa düşmemeli kuralına aykırı), ve süre `CFG` dışında
 * olduğu için hızlı modda hiç çalışmıyordu — yani simülasyonda ölçülemiyordu.
 * Kalıcı açmak ikisini birden çözüyor.
 */
function revealOwnPair(side) {
  const benim = new Set(S.teams[side].filter((u) => u.hp > 0).map((u) => u.el));
  const grup = {};
  S.board.forEach((c, i) => {
    if (c.matched || c.up || c.shown) return;
    (grup[c.el] = grup[c.el] || []).push(i);
  });
  const ciftler = Object.entries(grup).filter(([, a]) => a.length >= 2);
  // Önce kendi elementin; yoksa herhangi bir çift — boşa düşmesin.
  const secim = ciftler.find(([el]) => benim.has(el)) || ciftler[0];
  if (!secim) return null;

  const [x, y] = secim[1];
  S.board[x].shown = S.board[y].shown = true;
  // Açık kart iki taraf da görüyor: gerçek bir maçta da öyle olurdu.
  aiRemember(x, S.board[x].el);
  aiRemember(y, S.board[y].el);
  syncBoard();
  return [x, y];
}

function addLog(text, kind = '') {
  const log = $('#log');
  const row = document.createElement('div');
  row.className = kind ? 'l-' + kind : '';
  row.textContent = text;
  log.prepend(row);
  while (log.children.length > 3) log.lastChild.remove();
}

function floatDmg(unitEl, amount, colorVar) {
  const d = document.createElement('div');
  d.className = 'dmg';
  d.style.color = colorVar;
  d.textContent = '-' + amount;
  unitEl.appendChild(d);
  setTimeout(() => d.remove(), 800);
}

/* ---------------- tur akışı ---------------- */

function reveal(i) {
  const c = S.board[i];
  if (!c || c.up || c.matched || S.flipped.length >= 2) return false;
  c.up = true;
  S.flipped.push(i);
  aiRemember(i, c.el);
  syncBoard();
  return true;
}

async function tapCard(i) {
  if (S.over || S.busy || S.turn !== 'player') return;
  if (!reveal(i)) return;
  if (S.flipped.length < 2) return;

  S.busy = true;
  try {
    await resolve('player');
    while (S.turn === 'ai' && !S.over) await aiTurn();
  } finally {
    // hata olsa bile oyun kilitli kalmasın
    S.busy = false;
  }
}

async function resolve(side) {
  const [a, b] = S.flipped;
  S.flipped = [];
  const ca = S.board[a];
  const cb = S.board[b];

  await sleep(ca.el === cb.el ? CFG.matchPeek : CFG.flipPeek);

  if (ca.el !== cb.el) {
    ca.up = cb.up = false;
    syncBoard();
    // Sağanak (yıldırım): ıskalama sırayı devretmiyor.
    if (S.effects[side].spare > 0) {
      S.effects[side].spare--;
      addLog(`${sideName(side)}: Sağanak — ıskalama sayılmadı.`, side);
      syncSkills();
    } else {
      passTurn(side);
    }
    syncHeader();
    return;
  }

  // eşleşme
  ca.matched = cb.matched = true;
  await mergePair(a, b, ca.el);   // iki kart kalkar, birleşir, büyüyü doğurur
  syncBoard();

  const dealt = await doAttack(side, ca.el);

  if (dealt === 0) {
    // boşa giden eşleşme: kartlar kalktı ama sıra devrediliyor
    if (CHARGE_ON_EMPTY) { addCharge(side, ca.el, false); syncSkills(); }
    passTurn(side);
  } else {
    // Şarj: sadece HASARLI eşleşme. Zincirin 2+.'si bonus veriyor.
    const zincirli = S.chain >= 1;
    addCharge(side, ca.el, zincirli);
    syncSkills();

    if (++S.chain >= CFG.maxChain) {
      // hasar veren eşleşme sırayı korur — ama sonsuza kadar değil
      addLog(`${CFG.maxChain}'lü zincir doldu, sıra geçti.`, 'sys');
      passTurn(side);
    }
  }

  checkOver();
  if (!S.over) await maybeNewBoard();
  syncHeader();
}

function passTurn(side) {
  S.turn = other(side);
  S.chain = 0;

  // Yanma sırası başlayan tarafta işliyor — "tur başında hasar alır".
  const yanan = tickBurn(S.turn);
  if (yanan > 0) {
    addLog(`${sideName(S.turn)}: yanma ${yanan} hasar.`, S.turn);
    syncTeams();
    checkOver();
  }
}

async function doAttack(side, el) {
  const attackers = S.teams[side].filter((c) => c.hp > 0 && c.el === el);
  const foes = S.teams[other(side)];
  const elName = ELEMENTS[el].name;

  if (attackers.length === 0) {
    addLog(`${sideName(side)}: ${elName} çifti — o elementte karakter yok, sıra geçti.`, side);
    return 0;
  }

  // Dondur (buz): eşleşme sayılıyor — sıra korunuyor, şarj geliyor — ama
  // vuruş düşmüyor. Rakip normal oynadığı için istihbarat kaybı da yok.
  if (S.effects[side].frozen > 0) {
    S.effects[side].frozen--;
    addLog(`${sideName(side)}: ${elName} çifti donduruldu — hasar yok.`, side);
    syncSkills();
    for (const a of attackers) {
      const el = $('#u-' + a.id);
      if (el) { el.classList.add('frozen-hit'); setTimeout(() => el.classList.remove('frozen-hit'), 700); }
    }
    return attackers.reduce((t, a) => t + a.atk, 0);   // 0 değil: eşleşme geçerli
  }

  // Yankı (kadim): aynı eşleşme birden çok kez vuruyor.
  const kat = S.effects[side].echo > 0 ? S.effects[side].echo : 1;
  if (kat > 1) {
    S.effects[side].echo = 0;
    addLog(`${sideName(side)}: Yankı — vuruş ${kat} kez.`, side);
    syncSkills();
  }

  addLog(`${sideName(side)}: ${elName} çifti! ${attackers.length} karakter saldırıyor.`, side);

  let total = 0;
  for (let k = 0; k < kat; k++) {
    for (const a of attackers) {
      const target = foes.find((f) => f.hp > 0);
      if (!target) break;
      await strike(a, target);
      total += a.atk;
    }
  }
  return total;
}

async function strike(attacker, target) {
  const aEl = $('#u-' + attacker.id);
  const tEl = $('#u-' + target.id);

  // 1) hazırlık — caster kendi renginde toplanır, rune mührü parlar
  await windUp(attacker.el, aEl);

  // 2) fırlatma — geri tepme
  aEl.classList.add('attacking');
  await sleep(CFG.lunge);
  aEl.classList.remove('attacking');

  // 3) büyü yola çıkar; çözüldüğü an çarpma anıdır
  await castSpell(attacker.el, aEl, tEl);

  // 4) hasar tam çarpma anında uygulanır
  target.hp = Math.max(0, target.hp - attacker.atk);
  tEl.classList.add('hit');
  floatDmg(tEl, attacker.atk, ELEMENTS[attacker.el].color);
  shake();
  syncTeams();

  await sleep(CFG.hitHold);
  tEl.classList.remove('hit');

  if (target.hp === 0) addLog(`${target.name} düştü.`, 'kill');
}

async function maybeNewBoard() {
  if (!S.board.every((c) => c.matched)) return;
  await sleep(CFG.boardSwap);
  S.round++;
  S.board = makeBoard([S.teams.player, S.teams.ai]);
  S.aiMem = {};
  addLog(`Tahta yenilendi — ${S.round}. tur. Rakip her şeyi unuttu.`, 'sys');
  await sleep(buildBoard());   // yeni deste dağıtılana kadar bekle
}

function checkOver() {
  const pAlive = S.teams.player.some((c) => c.hp > 0);
  const aAlive = S.teams.ai.some((c) => c.hp > 0);
  if (aAlive && pAlive) return;

  S.over = aAlive ? 'ai' : 'player';
  onBattleEnd(S.over);
}

/* ---------------- yapay zeka ---------------- */

function aiRemember(i, el) {
  if (Math.random() < CFG.aiRecall) S.aiMem[i] = el;
}

function aiKnownPairs() {
  const byEl = {};
  for (const [key, el] of Object.entries(S.aiMem)) {
    const i = +key;
    if (S.board[i].matched || S.board[i].up) continue;
    (byEl[el] ||= []).push(i);
  }
  return Object.entries(byEl)
    .filter(([, idxs]) => idxs.length >= 2)
    .map(([el, idxs]) => ({ el, a: idxs[0], b: idxs[1] }));
}

const livingEls = (side) =>
  new Set(S.teams[side].filter((c) => c.hp > 0).map((c) => c.el));

// seçilebilir = eşleşmemiş VE şu an açık olmayan
function selectable(pred = () => true) {
  return S.board
    .map((_, i) => i)
    .filter((i) => !S.board[i].matched && !S.board[i].up && pred(i));
}

function pickRandom(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function aiPick() {
  const pairs = aiKnownPairs();

  // 1) hasar verecek bir çift biliyorsa onu oyna
  const mine = livingEls('ai');
  const good = pairs.find((p) => mine.has(p.el));
  if (good) return [good.a, good.b];

  // 2) oyuncunun işine yarayan bir çifti bazen engelle
  const theirs = livingEls('player');
  const deny = pairs.find((p) => theirs.has(p.el));
  if (deny && Math.random() < CFG.aiDenyChance) return [deny.a, deny.b];

  // 3) keşfet — önce hiç görmediği kartlar
  let pool = selectable((i) => S.aiMem[i] === undefined);
  if (!pool.length) pool = selectable();
  return pool.length ? [pickRandom(pool)] : [];
}

function aiSecondPick(first) {
  const el = S.board[first].el;

  // ilk kartın eşini hatırlıyor mu?
  for (const [key, e] of Object.entries(S.aiMem)) {
    const i = +key;
    if (i !== first && e === el && !S.board[i].matched && !S.board[i].up) return i;
  }

  let pool = selectable((i) => S.aiMem[i] === undefined);
  if (!pool.length) pool = selectable();
  return pool.length ? pickRandom(pool) : undefined;
}

async function aiTurn() {
  // unutkanlık
  const keys = Object.keys(S.aiMem);
  if (keys.length && Math.random() < CFG.aiForget) delete S.aiMem[pickRandom(keys)];

  // Barı dolduysa turun başında kullanıyor — oyuncu barı görüyor,
  // yani sürpriz değil, haber verilmiş bir hamle.
  if (skillReady('ai')) {
    await sleep(CFG.aiThink);
    await useSkill('ai');
    if (S.over) return;
  }

  await sleep(CFG.aiThink);
  const picks = aiPick();

  if (!reveal(picks[0])) { passTurn('ai'); syncHeader(); return; }
  await sleep(CFG.flipPeek);

  const second = picks.length > 1 ? picks[1] : aiSecondPick(picks[0]);
  if (!reveal(second)) {
    // seçilecek ikinci kart kalmadı — ilk kartı kapat, sırayı devret
    S.board[picks[0]].up = false;
    S.flipped = [];
    syncBoard();
    passTurn('ai');
    syncHeader();
    return;
  }
  await resolve('ai');
}

/* ---------------- bağlantılar ---------------- */

$('#board').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) tapCard(+card.dataset.i);
});

$('#myCharge').addEventListener('click', async () => {
  if (S.busy || S.over || S.turn !== 'player') return;
  S.busy = true;
  try { await useSkill('player'); } finally { S.busy = false; syncSkills(); }
});

/* ===== skills.js ===== */
/* Rune Clash — element yetenekleri (sinerji)
 *
 * Sistem tek cümle: HASARLI eşleşme başına 1 şarj, zincir (2. üst üste)
 * +1 bonus, 3 şarj dolunca o elementin yeteneği gönderilebilir.
 *
 * Boş eşleşme (destende olmayan element) şarj vermiyor — zaten sırayı da
 * devrediyor, ödüllendirilmesi ters teşvik olurdu.
 *
 * ŞARJ HIZI ÖLÇÜLDÜ (200'er maç, ortalama rakip):
 *   hafıza 0.55 → 4.13 hasarlı eşleşme + 0.93 zincir = 5.1 şarj → ~1.7 kullanım
 *   hafıza 0.70 → 5.03 + 1.38 = 6.4 şarj → ~2.1 kullanım
 *   hafıza 1.00 → 5.64 + 1.56 = 7.2 şarj → ~2.4 kullanım
 *
 * GÜÇ BÜTÇESİ: maçta ~5 saldırı var, her biri kabaca 25 hasar. Yetenek maçta
 * ~2 kez çıktığına göre bir kullanım **bir saldırı değerinde** olmalı (~25).
 * Daha fazlası verilirse oyun "kart çevirme" olmaktan çıkıp "yetenek bekleme"ye
 * döner. Aşağıdaki sayılar bu bütçeye göre seçildi.
 *
 * Tek elementli deste (üç şampiyon da aynı) yeteneği GÜÇLENMİŞ kullanır:
 * esnekliği yok, karşılığında gücü var.
 */

/* Şarj eşiği DESTE ŞEKLİNE bağlı.
 *
 * Ölçüm (800'er maç): tek elementli deste maçta 0.35 kez yetenek kullanıyordu,
 * dağıtılmış 1.76. Sebep şarj hasarlı eşleşmeden geliyor, tek element ise
 * tahtadaki 5 elementin yalnızca 1'inde hasar veriyor. Sistem arketip farkını
 * kapatmak için kurulmuştu ama açıyordu (12.5 → 17.3 puan).
 *
 * Eşiği element sayısına bağlamak kullanım hızını doğrudan eşitliyor. */
const CHARGE_BY_SHAPE = { 1: 2, 2: 3, 3: 4 };
let CHARGE_SCALE = true;    // `false`: hepsi 3 (ölçüm karşılaştırması için)
let CHARGE_NEED = 3;        // ölçekleme kapalıyken kullanılan sabit

/** Bu tarafın barı kaç şarjda dolar — destesindeki farklı element sayısına göre. */
function chargeNeed(side) {
  if (!CHARGE_SCALE) return CHARGE_NEED;
  const n = new Set(S.teams[side].map((u) => u.el)).size;
  return CHARGE_BY_SHAPE[n] || 3;
}

const CHAIN_BONUS = 1;      // zincirin 2. eşleşmesinden itibaren ek şarj

/* Boş eşleşme (destende olmayan element) şarj versin mi?
 * Ölçümle karar verildi — bkz. docs/fikirler.md. `let`: simülasyonda
 * ikisi de denenebilsin diye. */
let CHARGE_ON_EMPTY = false;

/* Her yetenek: ad, kısa açıklama (arayüzde birebir bu yazıyor) ve etkisi.
 * `guclu` alanı üç şampiyonun da o elementte olduğu destede geçerli. */
const SKILLS = {
  fire: {
    ad: 'Alev Fırtınası',
    metin: 'Rakip takımın tamamı 2 tur yanar.',
    metinGuclu: 'Rakip takımın tamamı 2 tur daha şiddetli yanar.',
    yanma: 6, yanmaGuclu: 9, tur: 2,      // 3 hedef × 6 × 2 tur ÷ paylaşım ≈ bütçe
  },
  /* Buz'a hasar eklendi. Saf engelleme ölçümde kaybediyordu (%32) ve maçı
     5.07 tahtaya uzatıp kilitliyordu: engellenen 25 hasar, harcanan bir
     kullanımla başabaş kalıyor ama tempo kaybettiriyor. Hasar hem dengeyi
     hem kilitlenmeyi çözüyor. Üst üste binme de sınırlı. */
  ice: {
    ad: 'Dondur',
    metin: 'Rakibin sıradaki eşleşmesi hasar vermez, rakip takım 7 hasar alır.',
    metinGuclu: 'Rakibin sıradaki eşleşmesi hasar vermez, rakip takım 11 hasar alır.',
    adet: 1, adetGuclu: 1, hasar: 7, hasarGuclu: 11, ustSinir: 2,
  },
  bolt: {
    ad: 'Sağanak',
    metin: 'Sıradaki 3 ıskalaman sırayı devretmez.',
    metinGuclu: 'Sıradaki 4 ıskalaman sırayı devretmez.',
    adet: 3, adetGuclu: 4,
  },
  /* Doğa yayarak iyileştiriyordu ve ölçümde en kötüsüydü (%24). Sorun miktar
     değil dağıtım: tam candakine yapılan iyileştirme çöpe gidiyor. Artık tek
     hedefe — ölmeye en yakın olana — yoğunlaşıyor. */
  nature: {
    ad: 'Yeniden Doğuş',
    metin: 'En az canı olan şampiyonun 25 iyileşir.',
    metinGuclu: 'En az canı olan şampiyonun 35 iyileşir.',
    can: 25, canGuclu: 35,
  },
  wind: {
    ad: 'Kasırga',
    metin: 'Destendeki bir elementin çifti açılır ve açık kalır.',
    metinGuclu: 'Destendeki iki çift açılır ve açık kalır.',
    adet: 1, adetGuclu: 2,
  },
  arcane: {
    ad: 'Yankı',
    metin: 'Sıradaki hasarlı eşleşmen iki kez vurur.',
    metinGuclu: 'Sıradaki hasarlı eşleşmen üç kez vurur.',
    kat: 2, katGuclu: 3,
  },
};

/** Bu tarafın destesinin tamamı aynı elementse yetenek güçlenir. */
function skillGuclu(side, el) {
  const takim = S.teams[side];
  return takim.length > 0 && takim.every((u) => u.el === el);
}

/** Arayüzde gösterilecek açıklama — deste ekranı ve savaş aynı metni kullanıyor. */
function skillMetin(el, guclu = false) {
  const s = SKILLS[el];
  return guclu ? s.metinGuclu : s.metin;
}

/* ---------------- şarj ---------------- */

/** Hasarlı eşleşme sonrası çağrılıyor. `zincirli` = zincirin 2+. eşleşmesi. */
function addCharge(side, el, zincirli) {
  const c = S.skill[side];
  if (c.hazir) return;                     // dolu bar beklerken şarj birikmiyor
  const gerek = chargeNeed(side);
  c.sarj += 1 + (zincirli ? CHAIN_BONUS : 0);
  c.el = el;                               // yetenek SON eşleşmenin elementi
  if (c.sarj >= gerek) { c.sarj = gerek; c.hazir = true; }
}

const skillReady = (side) => S.skill[side].hazir;

/* ---------------- etkiler ---------------- */

/**
 * Yeteneği kullanır. Sadece durumu değiştiriyor — animasyon ve DOM game.js'te,
 * böylece hızlı simülasyon buradan sorunsuz geçiyor.
 * Döndürdüğü metin olay günlüğüne yazılıyor.
 */
function castSkill(side) {
  const c = S.skill[side];
  if (!c.hazir) return null;

  const el = c.el;
  const s = SKILLS[el];
  const guclu = skillGuclu(side, el);
  const rakip = other(side);
  c.sarj = 0; c.hazir = false; c.el = null;

  const durum = S.effects[side];
  const rDurum = S.effects[rakip];

  switch (el) {
    case 'fire': {
      const miktar = guclu ? s.yanmaGuclu : s.yanma;
      for (const u of S.teams[rakip]) if (u.hp > 0) u.burn = { miktar, tur: s.tur };
      break;
    }
    case 'ice': {
      // Üst sınır: üst üste binerse maç bitmiyor (ölçüldü, 5.07 tahta).
      rDurum.frozen = Math.min(s.ustSinir, rDurum.frozen + (guclu ? s.adetGuclu : s.adet));
      const h = guclu ? s.hasarGuclu : s.hasar;
      for (const u of S.teams[rakip]) if (u.hp > 0) u.hp = Math.max(0, u.hp - h);
      break;
    }
    case 'bolt':
      durum.spare += guclu ? s.adetGuclu : s.adet;
      break;
    case 'nature': {
      const can = guclu ? s.canGuclu : s.can;
      // Yayarak değil, ölmeye en yakın olana. Tam candakine yapılan iyileştirme
      // çöpe gidiyordu; yoğunlaştırınca aynı miktar çok daha değerli.
      const hedef = S.teams[side].filter((u) => u.hp > 0).sort((a, b) => a.hp - b.hp)[0];
      if (hedef) hedef.hp = Math.min(CFG.maxHp, hedef.hp + can);
      break;
    }
    case 'wind':
      durum.peek = guclu ? s.adetGuclu : s.adet;   // game.js kaç çift açacağını okuyor
      break;
    case 'arcane':
      durum.echo = guclu ? s.katGuclu : s.kat;
      break;
  }

  return { ad: s.ad, el, guclu };
}

/** Tur başında yanma işler. Ölenleri game.js kontrol ediyor. */
function tickBurn(side) {
  let toplam = 0;
  for (const u of S.teams[side]) {
    if (u.hp <= 0 || !u.burn) continue;
    u.hp = Math.max(0, u.hp - u.burn.miktar);
    toplam += u.burn.miktar;
    if (--u.burn.tur <= 0) u.burn = null;
  }
  return toplam;
}

/** Savaş başlarken sıfır durum. */
const freshSkillState = () => ({
  skill:   { player: { sarj: 0, el: null, hazir: false },
             ai:     { sarj: 0, el: null, hazir: false } },
  effects: { player: { frozen: 0, spare: 0, echo: 0, peek: 0 },
             ai:     { frozen: 0, spare: 0, echo: 0, peek: 0 } },
});


/* ===== fx.js ===== */
/* Rune Clash — büyü efektleri
 *
 * Tasarım kuralı: elementleri ayıran şey renk değil, ZAMANLAMA ve HAREKET.
 * Aynı animasyonun dört rengi dört ayrı büyü gibi hissettirmiyor.
 *
 *   Ateş     → yavaş, yay çizerek uçar, patlar         (ağır, tehditkâr)
 *   Buz      → hızlı, düz, keskin; çarpınca paramparça (net, cerrahi)
 *   Yıldırım → yolculuk yok, anında çakar              (ani, şok)
 *   Doğa     → uzun hazırlık, sarmaşık büyüyerek gider (yavaş, kaçınılmaz)
 *   Rüzgar   → en hızlı, dönerek yay çizer, üç kesik   (çevik, savuran)
 *   Kadim    → uçmaz; hedefin üstünde mühür belirip    (mesafe tanımaz,
 *              içine çöker                              kaçınılmaz)
 */

const SPELL_TUNE = {
  fire:   { travel: 1.00, wind: 1.00, lift: 52 },
  ice:    { travel: 0.62, wind: 0.65, lift:  0 },
  bolt:   { travel: 0.34, wind: 0.55, lift:  0 },
  nature: { travel: 0.95, wind: 1.55, lift: 14 },
  wind:   { travel: 0.48, wind: 0.50, lift: 40 },
  arcane: { travel: 0.90, wind: 1.25, lift:  0 },
};

/* ---------------- geometri ---------------- */

// Savaşta #fx (ekranın içinde), diğer ekranlarda #fly (ekranların üstünde).
// Efektler her iki yerde de aynı kodla çalışsın diye tek kapı.
const layerEl = () => {
  const battle = document.getElementById('scr-battle');
  return battle && battle.classList.contains('active')
    ? document.getElementById('fx')
    : document.getElementById('fly');
};

function centerOf(el) {
  const r = el.getBoundingClientRect();
  const l = layerEl().getBoundingClientRect();
  return { x: r.left - l.left + r.width / 2, y: r.top - l.top + r.height / 2 };
}

// Yay için orta nokta. Kavis HEP ekran merkezine doğru bükülür — kenardaki
// karakterden atılan mermi yoksa ekran dışına taşıyor.
function arcMid(a, b, lift) {
  const w = layerEl().getBoundingClientRect().width;
  const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  mid.x += (w / 2 - mid.x >= 0 ? 1 : -1) * lift;
  return mid;
}

function spawn(cls, style) {
  const d = document.createElement('div');
  d.className = cls;
  for (const [k, v] of Object.entries(style)) {
    // özel değişkenler (--c) düz atamayla geçmiyor, setProperty şart
    if (k.startsWith('--')) d.style.setProperty(k, v);
    else d.style[k] = v;
  }
  layerEl().appendChild(d);
  return d;
}

const at = (p) => ({ left: p.x + 'px', top: p.y + 'px' });
const kill = (node, after) => setTimeout(() => node.remove(), after);

/* ---------------- ortak parçalar ---------------- */

// çarpma: genişleyen halka + dışa saçılan parçacıklar
function impact(p, color, opts = {}) {
  const { count = 9, spread = 46, ringScale = 3.4, shard = false, flash = true } = opts;
  const dur = CFG.spellImpact;

  const ring = spawn('fx-ring', { ...at(p), '--c': color });
  ring.animate(
    [
      { transform: 'translate(-50%,-50%) scale(.2)', opacity: 1 },
      { transform: `translate(-50%,-50%) scale(${ringScale})`, opacity: 0 },
    ],
    { duration: dur, easing: 'cubic-bezier(.2,.7,.3,1)' }
  );
  kill(ring, dur);

  // Beyaz çekirdek parlaması vuruşta iyi, birleşmede kötü: orada rune'la
  // yarışıp ikisini birden "hata" gibi gösteriyor.
  if (flash) {
    const fl = spawn('fx-flash', { ...at(p), '--c': color });
    fl.animate(
      [{ transform: 'translate(-50%,-50%) scale(1.6)', opacity: .95 },
       { transform: 'translate(-50%,-50%) scale(.4)', opacity: 0 }],
      { duration: dur * 0.55, easing: 'ease-out' }
    );
    kill(fl, dur);
  }

  for (let i = 0; i < count; i++) {
    const ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = spread * (0.55 + Math.random() * 0.75);
    const bit = spawn(shard ? 'fx-shard' : 'fx-bit', {
      ...at(p),
      '--c': color,
      transform: `translate(-50%,-50%) rotate(${(ang * 180) / Math.PI}deg)`,
    });
    bit.animate(
      [
        { transform: `translate(-50%,-50%) rotate(${(ang * 180) / Math.PI}deg) translateX(0) scale(1)`, opacity: 1 },
        { transform: `translate(-50%,-50%) rotate(${(ang * 180) / Math.PI}deg) translateX(${dist}px) scale(.25)`, opacity: 0 },
      ],
      { duration: dur * (0.7 + Math.random() * 0.5), easing: 'cubic-bezier(.15,.8,.35,1)' }
    );
    kill(bit, dur * 1.3);
  }
}

// uçan merminin arkasına iz bırakır
function trail(node, color, dur, every = 34) {
  const iv = setInterval(() => {
    const r = node.getBoundingClientRect();
    const l = layerEl().getBoundingClientRect();
    const dot = spawn('fx-trail', {
      left: r.left - l.left + r.width / 2 + 'px',
      top: r.top - l.top + r.height / 2 + 'px',
      '--c': color,
    });
    dot.animate(
      [{ transform: 'translate(-50%,-50%) scale(1)', opacity: .7 },
       { transform: 'translate(-50%,-50%) scale(.2)', opacity: 0 }],
      { duration: 260, easing: 'ease-out' }
    );
    kill(dot, 280);
  }, every);
  setTimeout(() => clearInterval(iv), dur);
}

/* ---------------- büyüler ---------------- */

// ATEŞ — yay çizerek uçan alev küresi, sonunda patlama
async function castFire(from, to, color, dur) {
  const mid = arcMid(from, to, SPELL_TUNE.fire.lift);
  const orb = spawn('fx-orb', { ...at(from), '--c': color });

  orb.animate(
    [
      { transform: 'translate(-50%,-50%) scale(.35)', offset: 0 },
      { transform: `translate(-50%,-50%) translate(${mid.x - from.x}px,${mid.y - from.y}px) scale(1.25)`, offset: .55 },
      { transform: `translate(-50%,-50%) translate(${to.x - from.x}px,${to.y - from.y}px) scale(1.05)`, offset: 1 },
    ],
    { duration: dur, easing: 'cubic-bezier(.35,0,.65,1)' }
  );
  trail(orb, color, dur);

  await sleep(dur);
  orb.remove();
  impact(to, color, { count: 11, spread: 52, ringScale: 3.8 });
}

// BUZ — düz ve hızlı mızrak, çarpınca kırılır
async function castIce(from, to, color, dur) {
  const ang = (Math.atan2(to.y - from.y, to.x - from.x) * 180) / Math.PI;
  const shard = spawn('fx-lance', { ...at(from), '--c': color, '--a': ang + 'deg' });

  shard.animate(
    [
      { transform: `translate(-50%,-50%) rotate(${ang}deg) scaleX(.4)`, opacity: .3 },
      { transform: `translate(-50%,-50%) rotate(${ang}deg) translateX(6px) scaleX(1)`, opacity: 1, offset: .18 },
      { transform: `translate(-50%,-50%) translate(${to.x - from.x}px,${to.y - from.y}px) rotate(${ang}deg) scaleX(1)`, opacity: 1 },
    ],
    // sabit hız: buz "fırlatılan" değil "atılan" bir şey gibi dursun
    { duration: dur, easing: 'linear' }
  );
  // ince ve hızlı olduğu için tek başına okunmuyordu — arkasında kırağı izi
  trail(shard, color, dur, 26);

  await sleep(dur);
  shard.remove();
  impact(to, color, { count: 10, spread: 44, ringScale: 2.6, shard: true });
}

// ŞİMŞEK — yolculuk yok, iki nokta arasında anında çakar
async function castBolt(from, to, color, dur) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'fx-bolt');
  svg.style.setProperty('--c', color);

  const mk = (width, opacity) => {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', boltPoints(from, to, 7, 15));
    line.setAttribute('stroke-width', width);
    line.setAttribute('opacity', opacity);
    svg.appendChild(line);
    return line;
  };
  mk(7, .35);   // dış hâle
  const core = mk(2.5, 1);

  layerEl().appendChild(svg);

  // iki kez titret — tek çakış cansız duruyor
  svg.animate(
    [{ opacity: 1 }, { opacity: .25 }, { opacity: 1 }, { opacity: .5 }, { opacity: 0 }],
    { duration: dur * 2.2, easing: 'steps(5,end)' }
  );
  setTimeout(() => core.setAttribute('points', boltPoints(from, to, 7, 15)), dur * 0.9);

  await sleep(dur);
  impact(to, color, { count: 8, spread: 40, ringScale: 3.0, shard: true });
  kill(svg, dur * 1.4);
}

function boltPoints(a, b, segments, amp) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    let x = a.x + dx * t, y = a.y + dy * t;
    if (i > 0 && i < segments) {
      const off = (Math.random() * 2 - 1) * amp;
      x += (-dy / len) * off;
      y += (dx / len) * off;
    }
    pts.push(x.toFixed(1) + ',' + y.toFixed(1));
  }
  return pts.join(' ');
}

// DOĞA — sarmaşık KIVRILARAK hedefe büyür, üstünde dikenler açar
//
// Önce düz bir çubuğun clip-path ile açılmasıydı; "sarmaşık" değil "yeşil ışın"
// gibi duruyordu. Şimdi gerçek bir S eğrisi çiziliyor (stroke-dashoffset ile
// uçtan uca büyüyor) ve dikenler eğrinin ÜSTÜNE, teğetine dik oturuyor.
async function castNature(from, to, color, dur) {
  const NS = 'http://www.w3.org/2000/svg';
  const dx = to.x - from.x, dy = to.y - from.y;
  const len = Math.hypot(dx, dy) || 1;
  const px = -dy / len, py = dx / len;              // doğrultuya dik birim
  const amp = Math.min(52, len * 0.24);
  const side = Math.random() < .5 ? 1 : -1;

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'fx-vine');
  svg.style.setProperty('--c', color);
  const path = document.createElementNS(NS, 'path');
  path.setAttribute(
    'd',
    `M${from.x} ${from.y} ` +
    `C${from.x + dx * .33 + px * amp * side} ${from.y + dy * .33 + py * amp * side} ` +
    `${from.x + dx * .66 - px * amp * side} ${from.y + dy * .66 - py * amp * side} ` +
    `${to.x} ${to.y}`
  );
  svg.appendChild(path);
  layerEl().appendChild(svg);

  const total = path.getTotalLength();
  path.style.strokeDasharray = total;
  path.animate(
    [{ strokeDashoffset: total }, { strokeDashoffset: 0 }],
    { duration: dur, easing: 'cubic-bezier(.4,.1,.3,1)', fill: 'forwards' }
  );

  // dikenler eğrinin üstünde, teğete dik açılıyor
  const spikes = 5;
  for (let i = 1; i <= spikes; i++) {
    setTimeout(() => {
      const t = i / (spikes + 1);
      const p = path.getPointAtLength(total * t);
      const q = path.getPointAtLength(Math.min(total, total * t + 2));
      const ang = (Math.atan2(q.y - p.y, q.x - p.x) * 180) / Math.PI + 90;
      const s = spawn('fx-thorn', { left: p.x + 'px', top: p.y + 'px', '--c': color });
      s.animate(
        [{ transform: `translate(-50%,-50%) rotate(${ang}deg) scale(0)`, opacity: 1 },
         { transform: `translate(-50%,-50%) rotate(${ang}deg) scale(1)`, opacity: .95, offset: .4 },
         { transform: `translate(-50%,-50%) rotate(${ang}deg) scale(.6)`, opacity: 0 }],
        { duration: 460, easing: 'ease-out' }
      );
      kill(s, 480);
    }, dur * (i / (spikes + 1)));
  }

  await sleep(dur);
  svg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: 'ease-out', fill: 'forwards' });
  kill(svg, 240);
  impact(to, color, { count: 12, spread: 48, ringScale: 3.2 });
}

// RÜZGAR — üç hilal kesik, dönerek ve yay çizerek; hepsinden hızlı
async function castWind(from, to, color, dur) {
  const mid = arcMid(from, to, SPELL_TUNE.wind.lift);
  const ang = (Math.atan2(to.y - from.y, to.x - from.x) * 180) / Math.PI;

  for (let i = 0; i < 3; i++) {
    const g = spawn('fx-gust', { ...at(from), '--c': color });
    g.innerHTML = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
      stroke-width="11" stroke-linecap="round"><path d="M26 14 A44 44 0 0 1 26 86"/></svg>`;
    const off = (i - 1) * 13;

    g.animate(
      [
        { transform: `translate(-50%,-50%) rotate(${ang}deg) scale(.45)`, opacity: 0 },
        { transform: `translate(-50%,-50%) translate(${mid.x - from.x + off}px,${mid.y - from.y + off}px)
                      rotate(${ang + 200}deg) scale(1)`, opacity: 1, offset: .5 },
        { transform: `translate(-50%,-50%) translate(${to.x - from.x}px,${to.y - from.y}px)
                      rotate(${ang + 420}deg) scale(.8)`, opacity: 1 },
      ],
      { duration: dur, delay: i * 55, easing: 'cubic-bezier(.35,.05,.5,1)', fill: 'backwards' }
    );
    kill(g, dur + i * 55 + 40);
  }

  await sleep(dur + 110);
  impact(to, color, { count: 10, spread: 56, ringScale: 3.4 });
}

// KADİM — mesafe tanımaz: mühür doğrudan hedefin üstünde belirir, dönerek içine çöker
async function castArcane(from, to, color, dur) {
  const ring = spawn('fx-sigil-ring', { ...at(to), '--c': color });
  ring.innerHTML = `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor"

  // Önce yumuşatıcı bir eğri vardı ve hareketi başa yığıyordu — mühür okunabilir
  // boyutuna sürenin %12'sinde varıp kalan %88'de büzülüyordu. Gerçek hızda
  // ~30ms görünür kalıyordu, yani hiç. Şimdi oluş–DUR–çök.
  ring.animate(
    [

      { transform: 'translate(-50%,-50%) scale(1.5) rotate(-14deg)', opacity: .95, offset: .3 },
      { transform: 'translate(-50%,-50%) scale(1.28) rotate(22deg)', opacity: .9,  offset: .62 },

    ],

const SPELLS = {
  fire: castFire, ice: castIce, bolt: castBolt,
  nature: castNature, wind: castWind, arcane: castArcane,
};

/* ---------------- dışarıya açılan tek kapı ---------------- */

/**
 * Büyüyü fırlatır ve TAM ÇARPMA ANINDA çözülür — hasar orada uygulanır.
 * CFG.spellTravel 0 ise hiç efekt üretmez (hızlı simülasyon).
 */
async function castSpell(element, fromEl, toEl) {
  if (CFG.spellTravel <= 0 || !layerEl()) return;

  const tune = SPELL_TUNE[element];
  const color = ELEMENTS[element].color;
  const from = centerOf(fromEl);
  const to = centerOf(toEl);

  await SPELLS[element](from, to, color, CFG.spellTravel * tune.travel);
}

/** Büyü öncesi hazırlık — caster kendi renginde toplanır. */
async function windUp(element, fromEl) {
  if (CFG.spellCast <= 0) return;
  const ms = CFG.spellCast * SPELL_TUNE[element].wind;

  fromEl.classList.add('casting');
  const p = centerOf(fromEl);
  const sig = spawn('fx-sigil', { ...at(p), '--c': ELEMENTS[element].color });
  sig.innerHTML = elemIcon(element);
  sig.animate(
    [{ transform: 'translate(-50%,-50%) scale(.5) rotate(-25deg)', opacity: 0 },
     { transform: 'translate(-50%,-50%) scale(1.15) rotate(0deg)', opacity: .9, offset: .6 },
     { transform: 'translate(-50%,-50%) scale(.7) rotate(12deg)', opacity: 0 }],
    { duration: ms, easing: 'ease-out' }
  );
  kill(sig, ms);

  await sleep(ms);
  fromEl.classList.remove('casting');
}

/* ---------------- eşleşen çiftin birleşmesi ---------------- */

/**
 * Eşleşen iki kart hafifçe yükselir, aralarındaki noktada birleşir ve büyüyü
 * doğurur. Saldırının nereden geldiğini açıklayan hareket bu.
 * Çözüldüğünde kartlar tahtadan kalkmıştır, saldırı başlayabilir.
 */
async function mergePair(a, b, element) {
  const na = cardNode(a);
  const nb = cardNode(b);
  if (CFG.mergeFlight <= 0) return;

  const color = ELEMENTS[element].color;

  // Yuvaların konumundan hesaplıyoruz — kartlar animasyon sırasında kayıyor.
  const rectOf = (n) => n.parentElement.getBoundingClientRect();
  const sa = rectOf(na);
  const sb = rectOf(nb);
  const mid = {
    x: (sa.left + sa.width / 2 + sb.left + sb.width / 2) / 2,
    y: (sa.top + sa.height / 2 + sb.top + sb.height / 2) / 2,
  };

  const anims = [na, nb].map((n, k) => {
    n.classList.add('pop');
    n.parentElement.classList.add('merging');
    const r = rectOf(n);
    const dx = mid.x - (r.left + r.width / 2);
    const dy = mid.y - (r.top + r.height / 2);
    return n.animate(
      [
        // 1) kalk — hafif zıplayarak, "seçildim" der gibi
        { transform: 'none', opacity: 1, easing: 'cubic-bezier(.3,1.5,.5,1)' },
        { transform: 'translateY(-10px) scale(1.08)', opacity: 1, offset: .34,
          easing: 'cubic-bezier(.65,0,.85,.35)' },
        // 2) birbirine hızlanarak gir
        { transform: `translate(${dx}px,${dy - 10}px) scale(.4) rotate(${k ? 14 : -14}deg)`,
          opacity: 0 },
      ],
      { duration: CFG.mergeFlight, fill: 'forwards' }
    );
  });

  await sleep(CFG.mergeFlight);

  mergeBurst(mid, color, element);

  // kartlar artık tahtadan kalktı: önce sınıfı ver, sonra animasyonu bırak —
  // aksi halde bir kare boyunca geri geliyorlar
  [na, nb].forEach((n) => {
    n.classList.add('matched');
    n.classList.remove('pop');
    n.parentElement.classList.remove('merging');
  });
  anims.forEach((x) => x.cancel());

  await sleep(CFG.mergePop);
}

/**
 * Birleşme anı: rune oluşur, bir an DURUR, sonra dağılır.
 *
 * İlk hâli 0.3'ten 2.0'a fırlayıp kayboluyordu — göz bunu efekt değil hata
 * olarak okuyor. Çare yavaşlatmak değil, ortada bir DURMA anı olması: rune'un
 * okunacak kadar sabit kaldığı bir kare olunca "yanıp söndü" hissi geçiyor.
 */
function mergeBurst(clientPt, color, element) {
  const l = layerEl().getBoundingClientRect();
  const p = { x: clientPt.x - l.left, y: clientPt.y - l.top };
  const dur = CFG.mergeGlyph;

  const glyph = spawn('fx-merge', { ...at(p), '--c': color });
  glyph.innerHTML = elemIcon(element);
  glyph.animate(
    [
      { transform: 'translate(-50%,-50%) scale(.66)', opacity: 0, offset: 0 },
      { transform: 'translate(-50%,-50%) scale(1)',    opacity: 1, offset: .3 },   // oluştu
      { transform: 'translate(-50%,-50%) scale(1.05)', opacity: 1, offset: .58 },  // durdu
      { transform: 'translate(-50%,-50%) scale(1.4)',  opacity: 0, offset: 1 },    // dağıldı
    ],
    { duration: dur, easing: 'ease-out' }
  );
  kill(glyph, dur + 30);

  // beyaz çekirdek yok: sahnenin ortasındaki tek okunacak şey rune olsun
  impact(p, color, { count: 11, spread: 58, ringScale: 3.6, flash: false });
}

/**
 * Kartları desteden yuvalarına dağıtır.
 * Tahta önce boş görünür (yuvalar duruyor), sonra kartlar sırayla uçup yerleşir.
 * Toplam süreyi (ms) döndürür; 0 ise animasyon kapalı demektir.
 */
function dealBoard() {
  if (CFG.dealCard <= 0) return 0;

  const board = document.getElementById('board');
  const br = board.getBoundingClientRect();
  const cards = board.querySelectorAll('.card');

  // deste tahtanın hemen üstünde duruyormuş gibi
  const deck = { x: br.width / 2, y: -30 };
  let total = 0;

  cards.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const dx = deck.x - (r.left - br.left + r.width / 2);
    const dy = deck.y - (r.top - br.top + r.height / 2);
    const rot = -9 + (i % 5) * 3.6;                 // desteden çıkarken hafif savruk
    const delay = CFG.dealDelay + i * CFG.dealStagger;

    el.animate(
      [
        { transform: `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(.76)`, opacity: 0, offset: 0 },
        { transform: `translate(${dx * .82}px,${dy * .82}px) rotate(${rot * .85}deg) scale(.82)`, opacity: 1, offset: .14 },
        { transform: `translate(${dx * .06}px,${dy * .06}px) rotate(${rot * .1}deg) scale(1.04)`, opacity: 1, offset: .82 },
        { transform: 'none', opacity: 1, offset: 1 },
      ],
      {
        duration: CFG.dealCard,
        delay,
        easing: 'cubic-bezier(.22,.9,.3,1)',
        fill: 'backwards',   // sırası gelene kadar görünmesin — tahta boş dursun
      }
    );

    total = delay + CFG.dealCard;
  });

  return total;
}

/** Çarpma anında ekranı kısa ve hafif sarsar. */
function shake() {
  if (CFG.spellImpact <= 0) return;
  const app = document.getElementById('app');
  app.classList.remove('quake');
  void app.offsetWidth;      // animasyonu yeniden tetikle
  app.classList.add('quake');
  setTimeout(() => app.classList.remove('quake'), 260);
}

/* Rune Clash — şampiyonlar, koleksiyon, paketler
 *
 * Buradaki tek DOM işi yok: veri ve kayıt. Ekranlar screens.js'te.
 */

const RARITY = {
  common: { name: 'Yaygın',   color: '#8a93a8', pips: 1 },
  rare:   { name: 'Nadir',    color: '#5aa9e6', pips: 2 },
  epic:   { name: 'Destansı', color: '#c77dff', pips: 3 },
};

/* Baskı adedi her kartta aynı: 300.
 *
 * Önce nadirliğe göre değişiyordu (yaygın 5000, nadir 1200, destansı 300) —
 * ama o zaman yaygın bir kartın numarası 4813 olabiliyordu ve "0042/5000"
 * koleksiyoncu için bir şey ifade etmiyordu. Tek ve küçük bir adet, her
 * kartın numarasını okunur ve kıyaslanabilir yapıyor. */
const PRINT_RUN = 300;

/* Baskı adedini AŞAN kopyalar — asıl kovalanan şey.
 * Numaraları gerçekten 300'ün üstünde (301–360) ve altın renkte yazılıyorlar.
 * Ayrı bir "OVER" damgası yok: numaranın kendisi zaten söylüyor. */
const OVER_CHANCE = 0.04;

function mintSerial() {
  const over = Math.random() < OVER_CHANCE;
  const n = over
    ? PRINT_RUN + 1 + Math.floor(Math.random() * 60)
    : 1 + Math.floor(Math.random() * PRINT_RUN);
  return { n, run: PRINT_RUN };
}

/* Bayrağa değil veriye bak: aşım numaranın kendisinden anlaşılıyor.
   Eskiden `over: true` diye ayrı bir alan vardı, kayıtta numarayla ayrışabiliyordu. */
const isOver = (s) => !!s && s.n > s.run;

// Aşan her numaralıyı yener; numaralılarda küçük olan iyidir.
function betterSerial(a, b) {
  if (!b) return true;
  if (isOver(a) !== isOver(b)) return isOver(a);
  return a.n < b.n;
}

// Üç hane: baskı adedi 300, aşanlar en fazla 360 — dördüncü hane hep 0 kalıyordu.
const serialText = (s) =>
  !s ? '' : String(s.n).padStart(3, '0') + '/' + s.run;

// Nadirlik saldırı gücünü belirliyor. Aralık bilerek dar:
// koleksiyon derinliği dengeyi uçurmasın (rakip zaten güce göre üretiliyor).
const RARITY_ATK = { common: [11, 12], rare: [15], epic: [18] };

const CHAMPIONS = [

const champById = (id) => CHAMPIONS.find((c) => c.id === id);

/* ---------------- kayıt ---------------- */

// Başlangıçta 2 paket = 6 kart. Tek paket yetmiyor: deste 3 kart, elindeki üçü
// zaten oynuyorsun ve deste kurma ekranında seçim olmuyor. 6 kartta seçim var
// ve açılış üç pakete kıyasla daha çabuk bitiyor.
const INTRO_PACKS = 2;

const SAVE_KEY = 'rc_save_v1';

const SAVE = (() => {
  const base = {
    wins: 0, losses: 0, owned: {}, serials: {}, deck: [], packs: 0,
    introDone: false, introLeft: INTRO_PACKS,
    // rütbe ve ekonomi — anlamları rank.js'te
    coins: 0, placeGames: 0, placeWins: 0, tier: 0, div: 4, lp: 0,
  };
  try {
    return { ...base, ...JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') };
  } catch {
    return base;
  }
})();

function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch {}
}

/* --- göç ---
 * Tek paketlik başlangıç döneminden kalan kayıtlarda `introDone: true` yazıyor
 * ama oyuncunun 3 kartı var. O kayıtla açılınca başlangıç serisi hiç çalışmıyor.
 * Başlangıcın bitip bitmediğini bayrağa değil, açılmış paket sayısına bakarak
 * belirliyoruz — bayrak yalan söyleyebilir, kartlar söyleyemez.
 *
 * `v` bilerek varsayılanlarda YOK: olsaydı eski kayıtlar da sürümlü görünür,
 * göç hiç çalışmazdı.
 */
if (!SAVE.v) {
  const kartSayisi = Object.values(SAVE.owned).reduce((a, b) => a + b, 0);
  const acilanPaket = Math.floor(kartSayisi / 3);
  SAVE.introLeft = Math.max(0, INTRO_PACKS - acilanPaket);
  SAVE.introDone = SAVE.introLeft === 0;
  SAVE.v = 2;
  persist();
}

/* Baskı adedi 300'e indi (önce nadirliğe göre 5000/1200/300 idi).
 * Eski kayıtlarda 0634/1200 gibi numaralar duruyor; oranı koruyarak 300'e
 * ölçekleniyorlar — "ortalarda bir numara" ortalarda bir numara kalsın.
 * `over: true` yazan eskiler numarasızdı, onlara da 300 üstü bir numara veriliyor. */
if (!SAVE.serials) SAVE.serials = {};
if (SAVE.v < 3) {
  for (const s of Object.values(SAVE.serials)) {
    if (!s) continue;
    if (s.over && s.n == null) s.n = PRINT_RUN + 1 + Math.floor(Math.random() * 60);
    else if (s.n != null && s.run) s.n = Math.max(1, Math.round((s.n / s.run) * PRINT_RUN));
    s.run = PRINT_RUN;
    delete s.over;
  }
  SAVE.v = 3;
  persist();
}

// Seri numaraları sonradan geldi: eski kartlara da bas.
for (const id of Object.keys(SAVE.owned)) {
  if (!SAVE.serials[id] && champById(id)) SAVE.serials[id] = mintSerial();
}

const ownedIds = () => CHAMPIONS.filter((c) => SAVE.owned[c.id] > 0).map((c) => c.id);
const ownsAll = () => ownedIds().length >= CHAMPIONS.length;

/** Kartı koleksiyona ekler ve BU kopyanın seri numarasını döndürür. */
function grant(champ) {
  SAVE.owned[champ.id] = (SAVE.owned[champ.id] || 0) + 1;
  const s = mintSerial();
  if (betterSerial(s, SAVE.serials[champ.id])) SAVE.serials[champ.id] = s;
  return s;
}

/* ---------------- deste ---------------- */

// Deste bozuksa (kayıt eski, kart yok) sahip olunan ilk üçe düşer —
// oyun hiçbir durumda kartsız açılmasın.
function deckChampions() {
  const picked = SAVE.deck.map(champById).filter((c) => c && SAVE.owned[c.id] > 0);
  if (picked.length === 3) return picked;
  return ownedIds().slice(0, 3).map(champById);
}

/** Savaş motorunun beklediği biçim. */
function playerSquad() {
  const deck = deckChampions();
  if (!deck.length) return CHAMPIONS.slice(0, 3).map(toUnit); // olmaması gereken hâl
  return deck.map(toUnit);
}

const toUnit = (c, i) => ({ id: 'p' + i, name: c.name, el: c.el, atk: c.atk });

const squadPower = () => playerSquad().reduce((s, u) => s + u.atk, 0);

/* ---------------- paketler ---------------- */

function rollRarity() {
  const r = Math.random();
  if (r < 0.05) return 'epic';
  if (r < 0.30) return 'rare';
  return 'common';
}

/**
 * @param taken  aynı paket içinde tekrar çıkmasın
 * @param fresh  mümkünse sahip olunmayanı ver (başlangıç paketlerinde koleksiyon
 *               genişlesin — 9 kartın 6'sı kopya çıkarsa deste kurmak yine anlamsız)
 */
function pickChampion(el, rarity, taken, fresh) {
  const free = (f) => CHAMPIONS.filter((c) => !taken.has(c.id) && f(c));
  const isNew = (c) => !SAVE.owned[c.id];

  const elRar = free((c) => c.el === el && c.rarity === rarity);
  const rar   = free((c) => c.rarity === rarity);
  const els   = free((c) => c.el === el);
  const any   = free(() => true);

  // fresh: önce hep YENİ kart ara. Element+nadirlik tükenmişse elementten
  // vazgeç, nadirlikten değil — güç nadirliğe bağlı, element sadece renk.
  const order = fresh
    ? [elRar.filter(isNew), rar.filter(isNew), any.filter(isNew), elRar, rar, els, any]
    : [elRar, els, any];

  const c = pickRandom(order.find((p) => p.length));
  taken.add(c.id);
  return c;
}

/**
 * Bir paket = 3 kart.
 * İlk paket özel: üç FARKLI element ve en az bir nadir — oyuncunun ilk destesi
 * hem oynanabilir hem de dört elementten üçünü tanıtmış olsun.
 */
function rollPack({ first = false, fresh = false } = {}) {
  const taken = new Set();

  if (first) {
    const els = shuffle(Object.keys(ELEMENTS)).slice(0, 3);
    const rarities = shuffle(['rare', 'common', 'common']);
    return els.map((el, i) => pickChampion(el, rarities[i], taken, fresh));
  }

  return Array.from({ length: 3 }, () =>
    pickChampion(pickRandom(Object.keys(ELEMENTS)), rollRarity(), taken, fresh)
  );
}

/** Koleksiyonun en güçlü üçlüsü — başlangıç destesi için. */
function autoDeck() {
  SAVE.deck = ownedIds()
    .map(champById)
    .sort((a, b) => b.atk - a.atk)
    .slice(0, 3)
    .map((c) => c.id);
}


/* ===== rank.js ===== */
/* Rune Clash — rütbe, LP ve Rune Coin
 *
 * LoL'ün rütbe merdiveni birebir alındı: 10 kademe, ilk yedisinde IV→I bölümler
 * ve 100 LP, son üçü (Usta / Büyük Usta / Şampiyon) bölümsüz ve LP birikimli.
 *
 * Burada DOM işi yok — sadece veri ve kayıt. Ekranlar app.js'te.
 */

/* recall = yapay zekanın hatırlama olasılığı, tek başına tüm zorluk kadranı.
 *
 * Kademe başına +0.02 — bilerek küçük. 400'er maçlık ölçümde ortalama oyuncu
 * (hafıza 0.70) için kademe başına ~2-3 puanlık kazanma oranı farkı ediyor;
 * merdivenin iki ucu arasında ~30 puan. Beceri farkı bundan büyük kalıyor
 * (aynı kademede hafıza 0.4 → 1.0 arası ~35 puan), yani rütbe beceriyi
 * gölgelemiyor — oyunun en önemli doğrulaması buydu, korunması şart.
 *
 * Değerler merdivenin ORTASI dengede olacak şekilde konumlandı: ortalama
 * oyuncu 0.24 civarında %50 kazanıyor, o da Altın/Platin'e denk geliyor.
 * İlk denemede tüm eğri 0.06 yukarıdaydı ve ortalama oyuncu Gümüş'te bile
 * %37'de kalıyordu — merdiven tırmanılamıyordu. */
/* key: amblem dosyasının adı (assets/icons/rank-<key>.svg)
   color: kademe rengi — amblem currentColor ile bunu alıyor */
const TIERS = [
  //                                            apex: bölümü yok, LP birikiyor
  { name: 'Demir',      key: 'demir',     color: '#8a8694', apex: false, recall: 0.17 },
  { name: 'Bronz',      key: 'bronz',     color: '#b0743f', apex: false, recall: 0.19 },
  { name: 'Gümüş',      key: 'gumus',     color: '#b9c5d2', apex: false, recall: 0.21 },
  { name: 'Altın',      key: 'altin',     color: '#e6b53f', apex: false, recall: 0.23 },
  { name: 'Platin',     key: 'platin',    color: '#4fc9b4', apex: false, recall: 0.25 },
  { name: 'Zümrüt',     key: 'zumrut',    color: '#41c478', apex: false, recall: 0.27 },
  { name: 'Elmas',      key: 'elmas',     color: '#71adf0', apex: false, recall: 0.29 },
  { name: 'Usta',       key: 'usta',      color: '#ad6be6', apex: true,  recall: 0.31 },
  { name: 'Büyük Usta', key: 'buyukusta', color: '#e66565', apex: true,  recall: 0.33 },
  { name: 'Şampiyon',   key: 'sampiyon',  color: '#f2dc90', apex: true,  recall: 0.35 },
];

const APEX_FROM = 7;                 // Usta'dan itibaren bölüm yok
const APEX_LP   = [0, 500, 1000];    // Usta / Büyük Usta / Şampiyon eşikleri
const DIV_ROMAN = ['', 'I', 'II', 'III', 'IV'];   // div 1..4 (4 en alt)

const PLACEMENT_GAMES = 3;

/* Yerleştirme sonucu ilk rütbeyi belirliyor. LoL bunu gizli MMR'dan yapıyor;
   burada üç maçın galibiyet sayısı tek veri, ondan okunur bir eşleme kuruldu. */
const PLACEMENT_START = [
  { tier: 0, div: 4 },   // 0 galibiyet → Demir IV
  { tier: 0, div: 1 },   // 1 galibiyet → Demir I
  { tier: 1, div: 2 },   // 2 galibiyet → Bronz II
  { tier: 2, div: 4 },   // 3 galibiyet → Gümüş IV
];

/* LP kazanç/kayıp.
 *
 * Kazanç ile kayıp oranı, oyuncunun hangi kazanma oranında DENGEDE kalacağını
 * belirliyor: başabaş nokta = kayıp / (kazanç + kayıp). İlk denemede +22/-14
 * vardı, bu %39'da denge demek — oyuncu üç maçın ikisini kaybettiği yerde
 * takılıp kalıyordu ve bu kötü hissettiriyor. LoL'de kazanç ve kayıp kabaca
 * eşit, denge %50'de. Buradaki de ona yaklaştırıldı.
 *
 * Alt kademelerde küçük bir pozitif eğim var (başabaş %46): yeni oyuncu
 * Demir'de çakılıp kalmasın. Zirvede tersi (%51): Şampiyon zor tutulsun. */
function lpDelta(won, tier) {
  if (tier <= 3) return won ? 21 : -18;   // Demir–Altın · başabaş %46
  if (tier <= 6) return won ? 19 : -19;   // Platin–Elmas · başabaş %50
  return           won ? 18 : -19;        // Usta+ · başabaş %51
}

/* ---------------- Rune Coin ---------------- */

const COIN_WIN   = 4;   // kazanınca
const COIN_LOSS  = 1;   // kaybedince de kazanılıyor — boşa geçen maç olmasın
const PACK_PRICE = 5;

const affordablePacks = () => Math.floor(SAVE.coins / PACK_PRICE);

/** Paket satın alır. Parası yetmezse hiçbir şey yapmaz ve 0 döner. */
function buyPacks(n) {
  const adet = Math.max(0, Math.min(n | 0, affordablePacks()));
  if (!adet) return 0;
  SAVE.coins -= adet * PACK_PRICE;
  SAVE.packs += adet;
  persist();
  return adet;
}

/* ---------------- rütbe okuma ---------------- */

const isPlaced = () => SAVE.placeGames >= PLACEMENT_GAMES;

function rankLabel() {
  if (!isPlaced()) return `Yerleştirme ${SAVE.placeGames}/${PLACEMENT_GAMES}`;
  const t = TIERS[SAVE.tier];
  return t.apex ? t.name : `${t.name} ${DIV_ROMAN[SAVE.div]}`;
}

/** Yapay zekanın hafızası — tek başına tüm zorluk kadranı (bkz. CFG.aiRecall).
 *  Yerleştirmede orta kademe kullanılıyor: henüz rütbe yok. */
const rankRecall = () => (isPlaced() ? TIERS[SAVE.tier] : TIERS[2]).recall;

/* ---------------- maç sonucu ---------------- */

function promoteOnce() {
  if (SAVE.div > 1) { SAVE.div--; return; }
  if (SAVE.tier < APEX_FROM - 1) { SAVE.tier++; SAVE.div = 4; return; }
  SAVE.tier = APEX_FROM; SAVE.div = 0; SAVE.lp = 0;   // Elmas I → Usta
}

function demoteOnce() {
  if (SAVE.div < 4) { SAVE.div++; return true; }
  if (SAVE.tier > 0) { SAVE.tier--; SAVE.div = 1; return true; }
  return false;                                        // Demir IV taban
}

const apexTierFromLp = (lp) =>
  APEX_FROM + APEX_LP.filter((esik) => lp >= esik).length - 1;

/**
 * Maçı sicile işler: yerleştirme, LP, rütbe, Rune Coin ve rütbe atlama paketi.
 * Döndürdüğü özet sonuç ekranında gösteriliyor.
 */
function applyMatchResult(won) {
  const oncekiEtiket = rankLabel();
  const coins = won ? COIN_WIN : COIN_LOSS;
  SAVE.coins += coins;

  // --- yerleştirme maçları ---
  if (!isPlaced()) {
    SAVE.placeGames++;
    if (won) SAVE.placeWins++;
    const bitti = isPlaced();
    if (bitti) {
      const b = PLACEMENT_START[SAVE.placeWins];
      SAVE.tier = b.tier; SAVE.div = b.div; SAVE.lp = 0;
    }
    persist();
    return {
      placement: true, placementDone: bitti,
      oncekiEtiket, etiket: rankLabel(), coins, lp: 0, rankUps: 0, dustu: false,
    };
  }

  // --- LP ---
  const d = lpDelta(won, SAVE.tier);
  let rankUps = 0, dustu = false;

  if (SAVE.tier >= APEX_FROM) {
    const yeni = SAVE.lp + d;
    if (yeni < 0) {
      SAVE.tier = APEX_FROM - 1; SAVE.div = 1; SAVE.lp = 75;   // Usta → Elmas I
      dustu = true;
    } else {
      SAVE.lp = yeni;
      const yeniTier = apexTierFromLp(SAVE.lp);
      if (yeniTier > SAVE.tier) rankUps += yeniTier - SAVE.tier;
      if (yeniTier < SAVE.tier) dustu = true;
      SAVE.tier = yeniTier;
    }
  } else {
    SAVE.lp += d;
    while (SAVE.lp >= 100 && SAVE.tier < APEX_FROM) {
      SAVE.lp -= 100;
      promoteOnce();
      rankUps++;
    }
    while (SAVE.lp < 0) {
      if (!demoteOnce()) { SAVE.lp = 0; break; }
      SAVE.lp += 100;
      dustu = true;
    }
  }

  // Her rütbe atlayışı bir bedava paket.
  if (rankUps > 0) SAVE.packs += rankUps;
  persist();

  return { placement: false, oncekiEtiket, etiket: rankLabel(), coins, lp: d, rankUps, dustu };
}
