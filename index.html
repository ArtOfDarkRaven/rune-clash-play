/* Rune Clash — açılış, paket açma, ganimet, deste kurma */

const SCREENS = {
  loadMs:     3400,   // açılış ekranı
  packInMs:    620,   // paketin ekrana girişi
  tearMs:      480,   // paketin yırtılması
  cardFlyMs:   460,   // kartların paketten çıkışı
  flipMs:      520,   // kartın çevrilmesi
  settleMs:    320,   // lobi otururken kartların havada beklemesi
  toDeckMs:    620,   // kartın "Desteni Kur" tuşuna uçuşu
  toDeckGap:    70,   // kartlar arası gecikme — sıkı olsun ki akış gibi dursun
};

// Nadirlik arttıkça vurgu artıyor: daha uzun durma, daha büyük sıçrama, etiket.
const REVEAL = {
  // Nadir kartta yazı yok: paketten sık çıkıyor, her seferinde uçan etiket
  // vurgu olmaktan çıkıp gürültü oluyordu. Kartın kendi parlaması yeterli.
  common: { hold: 260, pop: 1.00, label: null,       beam: false },
  rare:   { hold: 520, pop: 1.09, label: null,       beam: false },
  epic:   { hold: 800, pop: 1.17, label: 'DESTANSI', beam: true  },
};

const LOAD_TIPS = [
  'Iskaladığın kart rakibe de bilgi verir.',
  'Elementinde karakterin yoksa çift bulmak sadece rakibi engeller.',
  'Üst üste üç eşleşmeden sonra sıra zorla geçer.',
  'Yıldırım yol almaz — anında çakar.',
  'Aynı elementten iki şampiyon, o rune bulununca iki kat vurur.',
  'Her kart 300 basıldı. Numarası 300\'ü aşan kopyalar altın yazılır.',
];

/* ---------------- şampiyon kartı ---------------- */

/* Şampiyon görseli varsa kullanılır, yoksa element sembolü + ışınlar kalır.
 * Dosya: src/assets/champ/<id>.png  (id = CHAMPIONS içindeki id)
 * Eksik olanı bir kez deneyip listeye yazıyoruz — her kart çiziminde
 * tekrar tekrar 404 istemeyelim. */
const ART_MISSING = new Set();

function champArt(c) {
  if (ART_MISSING.has(c.id)) return '';
  return `<img class="ch-img" src="assets/champ/${c.id}.png" alt="" loading="lazy"
            onerror="ART_MISSING.add('${c.id}');this.remove()">`;
}

/**
 * @param opts.pick    köşe rozeti metni ("1" / "✓")
 * @param opts.mini    küçük ızgara sürümü (alt yazı ve seri gizli)
 * @param opts.sealed  kapalı başlasın (paket açılışı için)
 * @param opts.serial  bu kopyanın seri numarası
 */
function champCardHtml(c, opts = {}) {
  const { pick = '', mini = false, sealed = false, serial = null } = opts;
  const rar = RARITY[c.rarity];
  const s = serial || SAVE.serials[c.id];
  const cls = ['champ', mini && 'mini', pick && 'picked', sealed && 'sealed',
               isOver(s) && 'over'].filter(Boolean).join(' ');

  return `
    <button class="${cls}" data-id="${c.id}" data-el="${c.el}"
            style="--c:${ELEMENTS[c.el].color}; --r:${rar.color}">
      <span class="ch-flip">
        <span class="ch-back"><span class="ch-back-mark">${MARK_SVG}</span></span>
        <span class="ch-face">
          <span class="ch-sheen"></span>
          <span class="ch-top">
            <span class="ch-pips">${'<i></i>'.repeat(rar.pips)}</span>
            <span class="ch-atk">${c.atk}</span>
          </span>
          <span class="ch-art">
            <span class="ch-rays"></span>
            <span class="ch-glyph">${elemIcon(c.el)}</span>
            ${champArt(c)}
          </span>
          <span class="ch-plate">
            <span class="ch-name">${c.name}</span>
            ${mini ? '' : `<span class="ch-title">${c.title}</span>`}
          </span>
          ${mini ? '' : `<span class="ch-serial">${serialText(s)}</span>`}
        </span>
      </span>
      ${pick ? `<span class="ch-badge">${pick}</span>` : ''}
    </button>`;
}

/* ---------------- açılış ---------------- */

function showLoading(then) {
  $('#loadMark').innerHTML = MARK_SVG;
  for (const orb of document.querySelectorAll('.load-orb')) {
    orb.innerHTML = elemIcon(orb.dataset.el);
    orb.style.setProperty('--c', ELEMENTS[orb.dataset.el].color);
  }
  $('#loadTip').textContent = pickRandom(LOAD_TIPS);
  $('#loadFill').style.animationDuration = SCREENS.loadMs + 'ms';

  show('scr-loading');
  setTimeout(then, SCREENS.loadMs);
}

/* ---------------- paket ---------------- */

const PACK_HTML = `
  <div class="pack">
    <span class="pk-tear"></span>
    <span class="pk-body">
      <span class="pk-sheen"></span>
      <span class="pk-inner">
        <span class="pk-mark">${'{{MARK}}'}</span>
        <span class="pk-word">RUNE CLASH</span>
        <span class="pk-rule"></span>
        <span class="pk-sub">BOOSTER · 3 KART</span>
      </span>
    </span>
    <span class="pk-burst"></span>
  </div>`;

let packCards = [];      // bu paketteki şampiyonlar
let packSerials = [];    // bu kopyaların seri numaraları
let packStage = 'closed';
let packIntro = false;
let haul = [];           // seri boyunca toplanan her şey: {c, s}
let packSeriNo = 0;      // bu seride kaçıncı paket açılıyor
let packSeriToplam = 0;  // seride toplam kaç paket var

/**
 * @param intro  başlangıç serisi mi
 * @param devam  aynı serinin SONRAKİ paketi mi — ganimet sıfırlanmasın diye
 */
function enterPack(intro = false, devam = false) {
  const nth = INTRO_PACKS - SAVE.introLeft + 1;
  packIntro = intro;
  packCards = rollPack({ first: intro && nth === 1, fresh: intro });
  packSerials = [];
  packStage = 'closed';

  if (!intro) {
    if (devam) {
      packSeriNo++;
    } else {
      // Yeni seri: ganimeti sıfırla ve kaç paket açılacağını say.
      // SAVE.packs bu noktada zaten bir azaltılmış oldu (açılan bu paket).
      haul = [];
      packSeriNo = 1;
      packSeriToplam = 1 + SAVE.packs;
    }
  }

  $('#packHead').textContent = intro
    ? `Başlangıç paketi · ${nth}/${INTRO_PACKS}`
    : packSeriToplam > 1 ? `Paket · ${packSeriNo}/${packSeriToplam}` : 'Yeni paket';
  $('#packCards').innerHTML = '';
  $('#packBtn').textContent = 'PAKETİ AÇ';
  $('#packBtn').disabled = false;

  // Paket her seferinde sıfırdan kuruluyor — eski yırtık hâlinin geri sarması yok.
  $('#packSlot').innerHTML = PACK_HTML.replace('{{MARK}}', MARK_SVG);
  show('scr-pack');

  const box = $('.pack', $('#packSlot'));
  box.animate(
    [
      { transform: 'translateY(130px) rotate(-7deg) scale(.84)', opacity: 0 },
      { transform: 'translateY(-12px) rotate(2deg) scale(1.03)', opacity: 1, offset: .68 },
      { transform: 'translateY(0) rotate(0deg) scale(1)', opacity: 1 },
    ],
    { duration: SCREENS.packInMs, easing: 'cubic-bezier(.2,.95,.3,1)', fill: 'backwards' }
  );
}

async function tearPack() {
  if (packStage !== 'closed') return;
  packStage = 'tearing';
  // Yazı SİLİNMİYOR, görünmez yapılıyor. Boşaltınca tuşun yüksekliği 50px'den
  // 34px'e düşüyor, sayfa yeniden ortalanıyor ve kartlar zıplıyordu.
  $('#packBtn').disabled = true;
  $('#packBtn').classList.add('yazisiz');

  const box = $('.pack', $('#packSlot'));
  const tear = $('.pk-tear', box);
  const burst = $('.pk-burst', box);

  box.animate(
    [{ transform: 'rotate(0)' }, { transform: 'rotate(-2.4deg)' },
     { transform: 'rotate(2.4deg)' }, { transform: 'rotate(0)' }],
    { duration: 260, iterations: 2 }
  );
  await sleep(300);

  // Yırtık ANİMASYON, transition değil: sınıf kalkınca geri sarmasın.
  tear.animate(
    [
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: 'translate(46px,-72px) rotate(28deg)', opacity: 0 },
    ],
    { duration: SCREENS.tearMs, easing: 'cubic-bezier(.4,0,.7,.4)', fill: 'forwards' }
  );
  burst.animate(
    [
      { transform: 'translate(-50%,-50%) scale(0)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1.15)', opacity: .95, offset: .25 },
      { transform: 'translate(-50%,-50%) scale(2.6)', opacity: 0 },
    ],
    { duration: 800, easing: 'cubic-bezier(.2,.8,.3,1)', delay: 90, fill: 'backwards' }
  );
  await sleep(SCREENS.tearMs);

  // Seri numaraları kartlar ÇİZİLMEDEN önce basılmalı — sonra basılınca
  // kartın üstünde boş bir şerit kalıyordu.
  packSerials = packCards.map(grant);
  packCards.forEach((c, i) => haul.push({ c, s: packSerials[i] }));
  persist();

  // kartlar paketten çıkıp yelpaze yapar (kapalı yüzleri yukarıda)
  const host = $('#packCards');
  host.innerHTML = packCards
    .map((c, i) => champCardHtml(c, { sealed: true, serial: packSerials[i] }))
    .join('');
  const nodes = [...host.children];
  const tilt = [-1, 0, 1];

  nodes.forEach((n, i) => {
    n.animate(
      [
        { transform: 'translate(0,130px) scale(.42) rotate(0deg)', opacity: 0 },
        { transform: `translate(${tilt[i] * 5}px,-10px) scale(1.06) rotate(${tilt[i] * 4}deg)`, opacity: 1, offset: .72 },
        { transform: `translate(0,0) scale(1) rotate(${tilt[i] * 2}deg)`, opacity: 1 },
      ],
      { duration: SCREENS.cardFlyMs, delay: i * 100, easing: 'cubic-bezier(.2,.95,.3,1)', fill: 'backwards' }
    );
  });

  box.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.8) translateY(20px)' }],
    { duration: 380, easing: 'ease-in', fill: 'forwards' });

  await sleep(SCREENS.cardFlyMs + 2 * 100 + 140);

  // tek tek çevir — asıl an bu
  for (const [i, n] of nodes.entries()) {
    await revealOne(n, packCards[i], packSerials[i]);
  }

  packStage = 'done';
  $('#packBtn').disabled = false;
  $('#packBtn').classList.remove('yazisiz');
  const sonraki = packIntro ? SAVE.introLeft > 1 : SAVE.packs > 0;
  $('#packBtn').textContent = sonraki ? 'SONRAKİ PAKET' : 'DEVAM';
}

/**
 * Bir kartı çevirir ve nadirliğine göre vurgular.
 *
 * Vurgu kartın DIŞINA saçılan parçacıklarla değil, kartın KENDİSİYLE yapılıyor:
 * çerçevesi kendi renginde parlıyor ve üstünden folyo ışığı geçiyor. Saçılan
 * noktalar kartın parçası gibi durmuyor, ekran arızası gibi duruyordu.
 */
async function revealOne(node, champ, serial) {
  const cfg = REVEAL[champ.rarity];
  const over = isOver(serial);
  const color = over ? '#e8c56a' : RARITY[champ.rarity].color;
  const strength = over ? 3 : RARITY[champ.rarity].pips;

  node.classList.remove('sealed');
  await sleep(SCREENS.flipMs * 0.42);      // kart yarılandığında tetikle

  node.style.setProperty('--gw', strength);
  node.classList.add('revealing');
  setTimeout(() => node.classList.remove('revealing'), 800);

  if (cfg.beam || over) beamAt(node, color);

  node.animate(
    [{ transform: 'scale(1)' }, { transform: `scale(${cfg.pop})`, offset: .34 }, { transform: 'scale(1)' }],
    { duration: 460, easing: 'cubic-bezier(.3,1.35,.5,1)' }
  );

  // Aşan kopyada damga değil numaranın kendisi uçuyor — kovalanan şey o.
  const label = over ? serialText(serial) : cfg.label;
  if (label) floatLabel(node, label, color);

  await sleep(cfg.hold);
}

function cardCenter(node) {
  const r = node.getBoundingClientRect();
  const l = layerEl().getBoundingClientRect();
  return { x: r.left - l.left + r.width / 2, y: r.top - l.top + r.height / 2, w: r.width, h: r.height };
}

function floatLabel(node, text, color) {
  const p = cardCenter(node);
  const el = spawn('fx-rarity', { left: p.x + 'px', top: p.y - p.h * 0.62 + 'px', '--c': color });
  el.textContent = text;
  el.animate(
    [
      { transform: 'translate(-50%,-50%) scale(.7)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .22 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .68 },
      { transform: 'translate(-50%,-140%) scale(.95)', opacity: 0 },
    ],
    { duration: 1100, easing: 'cubic-bezier(.2,.9,.3,1)' }
  );
  kill(el, 1120);
}

function beamAt(node, color) {
  const p = cardCenter(node);
  const el = spawn('fx-beam', { left: p.x + 'px', top: p.y + 'px', '--c': color, height: p.h * 3.4 + 'px' });
  el.animate(
    [
      { transform: 'translate(-50%,-50%) scaleX(.2) scaleY(.4)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scaleX(1) scaleY(1)', opacity: .85, offset: .18 },
      { transform: 'translate(-50%,-50%) scaleX(.4) scaleY(1.1)', opacity: 0 },
    ],
    { duration: 900, easing: 'cubic-bezier(.2,.8,.3,1)' }
  );
  kill(el, 920);
}

async function finishPack() {
  if (packStage === 'closed') return tearPack();
  if (packStage !== 'done') return;
  packStage = 'leaving';
  $('#packBtn').disabled = true;

  if (packIntro) {
    SAVE.introLeft--;
    persist();
    if (SAVE.introLeft > 0) return enterPack(true);
    SAVE.introDone = true;
    autoDeck();
    persist();
  } else {
    const deck = SAVE.deck.filter((id) => SAVE.owned[id] > 0);
    for (const c of packCards) if (deck.length < 3 && !deck.includes(c.id)) deck.push(c.id);
    SAVE.deck = deck;
    persist();

    // Elde paket kaldıysa arka arkaya aç — başlangıç serisiyle aynı akış.
    // Önce her paket için lobiye dönülüyordu; iki paket alan oyuncu ikincisini
    // ayrıca "Paket Aç"a basarak açmak zorunda kalıyordu.
    if (SAVE.packs > 0) {
      SAVE.packs--;
      persist();
      return enterPack(false, true);
    }
  }

  // Tek paket zaten tek sayfada duruyor; özet ekranı ancak birden fazlaysa anlamlı.
  if (haul.length > 3) return enterHaul();
  await flyToDeck('#packCards');
  enterLobby();
}

/* ---------------- ganimet özeti ---------------- */

function enterHaul() {
  const packs = Math.round(haul.length / 3);
  $('#haulSub').textContent = `${packs} paket · ${haul.length} kart`;
  $('#haulGrid').innerHTML = haul.map(({ c, s }) => champCardHtml(c, { serial: s })).join('');
  show('scr-haul');

  [...$('#haulGrid').children].forEach((n, i) => {
    n.animate(
      [{ transform: 'translateY(26px) scale(.9)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 420, delay: 60 + i * 55, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'backwards' }
    );
  });
}

async function finishHaul() {
  $('#haulBtn').disabled = true;
  await flyToDeck('#haulGrid');
  $('#haulBtn').disabled = false;
  enterLobby();
}

/* ---------------- kartların desteye uçuşu ---------------- */

/**
 * Kartlar "Desteni Kur" tuşuna uçar. Süs değil, öğretme: oyuncu az önce açtığı
 * kartların nereye gittiğini ve desteyi nereden kuracağını görmüş oluyor.
 */
async function flyToDeck(fromSel) {
  const cards = [...$(fromSel).children];
  if (!cards.length || SCREENS.toDeckMs <= 0) return;

  // Ekran değişince konumlar kaybolur — önce yerlerini ve görünüşlerini al.
  const rects = cards.map((n) => n.getBoundingClientRect());
  const html = cards.map((n) => n.outerHTML);

  const layer = $('#fly');
  const clones = rects.map((r, i) => {
    const n = document.createElement('div');
    n.className = 'fly-card';
    n.innerHTML = html[i];
    Object.assign(n.style, {
      left: r.left + 'px', top: r.top + 'px',
      width: r.width + 'px', height: r.height + 'px',
    });
    layer.appendChild(n);
    return n;
  });

  enterLobby();
  await sleep(SCREENS.settleMs);   // ekran girişi otursun ki hedefi doğru ölçelim

  const t = $('#deckBtn').getBoundingClientRect();
  const tx = t.left + t.width / 2;
  const ty = t.top + t.height / 2;

  // Sade bir akış: hafif yükselip hedefe süzülüyorlar. Dönme yok, ortada
  // sıçrama yok — 9 kart aynı anda dönerek uçunca kaos oluyordu.
  clones.forEach((n, i) => {
    const r = rects[i];
    const dx = tx - (r.left + r.width / 2);
    const dy = ty - (r.top + r.height / 2);
    const delay = i * SCREENS.toDeckGap;

    n.animate(
      [
        { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 0 },
        { transform: `translate(${dx * .5}px,${dy * .5 - 16}px) scale(.66)`, opacity: 1, offset: .58 },
        { transform: `translate(${dx}px,${dy}px) scale(.2)`, opacity: 0, offset: 1 },
      ],
      { duration: SCREENS.toDeckMs, delay, easing: 'cubic-bezier(.42,.02,.5,1)', fill: 'forwards' }
    );

    setTimeout(() => n.remove(), SCREENS.toDeckMs + delay);
  });

  const last = SCREENS.toDeckMs + (clones.length - 1) * SCREENS.toDeckGap;
  await sleep(last + 40);

  glowDeckBtn();          // tek parıltı, hepsi girdikten sonra
  layer.innerHTML = '';
  await sleep(420);
}

function glowDeckBtn() {
  const b = $('#deckBtn');
  b.classList.remove('filled');
  void b.offsetWidth;
  b.classList.add('filled');
  setTimeout(() => b.classList.remove('filled'), 820);
}

/* ---------------- deste kurma ---------------- */

let draft = [];
let deckSort = 'power';
let deckSortDir = 1;      // 1 = azalan, -1 = artan
let deckFilter = '';      // '' = tümü, yoksa element anahtarı

// ELEMENTS'ten türetiliyor: yeni element eklenince burayı güncellemeyi
// unutmak filtre çipinin ve element sıralamasının sessizce eksik kalmasına yol açıyor.
const EL_ORDER = Object.keys(ELEMENTS);
const RAR_ORDER = { epic: 0, rare: 1, common: 2 };

const SORTERS = {
  power:   (a, b) => b.atk - a.atk,
  element: (a, b) => EL_ORDER.indexOf(a.el) - EL_ORDER.indexOf(b.el) || b.atk - a.atk,
  rarity:  (a, b) => RAR_ORDER[a.rarity] - RAR_ORDER[b.rarity] || b.atk - a.atk,
};

function sortChamps(list) {
  const out = [...list].sort(
    (a, b) => SORTERS[deckSort](a, b) || a.name.localeCompare(b.name, 'tr')
  );
  return deckSortDir < 0 ? out.reverse() : out;
}

function enterDeck() {
  draft = deckChampions().map((c) => c.id);
  buildFilterChips();
  paintDeck();
  show('scr-deck');
}

function buildFilterChips() {
  $('#deckFilter').innerHTML =
    `<button data-el="" class="on">Tümü</button>` +
    EL_ORDER.map(
      (el) => `<button data-el="${el}" style="--c:${ELEMENTS[el].color}"
                       aria-label="${ELEMENTS[el].name}">${elemIcon(el)}</button>`
    ).join('');
}

function paintDeck() {
  const owned = ownedIds().map(champById);
  const shown = sortChamps(owned.filter((c) => !deckFilter || c.el === deckFilter));

  $('#deckCount').textContent = `${draft.length}/3`;
  $('#deckOwned').textContent = deckFilter
    ? `${shown.length} / ${owned.length}`
    : `${owned.length}/${CHAMPIONS.length}`;
  $('#deckSave').disabled = draft.length !== 3;

  for (const b of $('#deckSort').children) b.classList.toggle('on', b.dataset.sort === deckSort);
  for (const b of $('#deckFilter').children) b.classList.toggle('on', b.dataset.el === deckFilter);
  $('#deckSort').dataset.dir = deckSortDir < 0 ? 'up' : 'down';

  $('#deckSlots').innerHTML = [0, 1, 2]
    .map((i) => {
      const c = champById(draft[i]);
      return c
        ? champCardHtml(c, { pick: String(i + 1) })
        : '<div class="champ empty"><span class="ch-flip"><span class="ch-face"><span class="ch-plus">+</span></span></span></div>';
    })
    .join('');

  renderSynergy();

  // Koleksiyon kartları da tam sürüm: seçili olanlarla aynı görünsünler.
  $('#deckGrid').innerHTML = shown
    .map((c) => champCardHtml(c, { pick: draft.includes(c.id) ? '✓' : '' }))
    .join('');
}

/** Destedeki element sayımı ve şarj eşiği — iki yerde de kullanılıyor. */
function synDurum() {
  const elSayim = {};
  for (const id of draft.filter(Boolean)) {
    const c = champById(id);
    if (c) elSayim[c.el] = (elSayim[c.el] || 0) + 1;
  }
  const farkli = Object.keys(elSayim).length;
  return { elSayim, farkli, gerek: CHARGE_BY_SHAPE[farkli] || 3 };
}

/**
 * Deste ekranındaki sinerji şeridi — TEK SATIR.
 *
 * Önce altı yeteneğin açıklaması buradaydı ve kartları ekrandan atıyordu.
 * Artık sadece sembol + sayı; açıklamalar bilgi düğmesinin arkasındaki
 * pencerede. Deste kurarken göz kartlarda olmalı.
 */
function renderSynergy() {
  const { elSayim, gerek } = synDurum();

  const cipler = Object.keys(ELEMENTS)
    .filter((el) => elSayim[el])
    .map((el) => `
      <span class="syn-chip" style="--c:${ELEMENTS[el].color}" title="${SKILLS[el].ad}">
        <i>${elemIcon(el)}</i>${elSayim[el]}
      </span>`).join('');

  $('#deckSyn').innerHTML = `
    ${cipler || '<span class="syn-bos">kart seç</span>'}
    <span class="syn-need">${gerek} şarj</span>
    <button class="syn-info" id="synInfo">
      <i>i</i>SİNERJİ
    </button>`;
  $('#synInfo').addEventListener('click', (e) => { e.stopPropagation(); openSynSheet(); });
}

/** Açıklamalar penceresi: altı yeteneğin hepsi, sahip olmasan bile. */
function openSynSheet() {
  const { elSayim, gerek } = synDurum();

  $('#synList').innerHTML = Object.keys(ELEMENTS).map((el) => {
    const adet = elSayim[el] || 0;
    const guclu = adet === 3;
    return `
      <div class="syn-row ${adet ? 'on' : ''}" style="--c:${ELEMENTS[el].color}">
        <span class="syn-ico">${elemIcon(el)}</span>
        <span class="syn-body">
          <b>${SKILLS[el].ad}</b>${guclu ? '<i class="syn-plus">güçlü</i>' : ''}
          <span class="syn-txt">${skillMetin(el, guclu)}</span>
        </span>
        <span class="syn-n">${adet ? adet + '×' : ''}</span>
      </div>`;
  }).join('');

  $('#synRule').textContent =
    `Hasarlı eşleşme 1 şarj · üst üste eşleşme +1 · bar ${gerek} şarjda dolar ` +
    `· dolunca son eşleştirdiğin elementin yeteneği çıkar`;
  $('#synSheet').hidden = false;
  // Açılış tıklaması arka plana ulaşıp pencereyi anında kapatabiliyor.
  synAcilis = Date.now();
}
let synAcilis = 0;
const synKapanabilir = () => Date.now() - synAcilis > 250;

function toggleDraft(id) {
  const at = draft.indexOf(id);
  if (at >= 0) draft.splice(at, 1);
  else if (draft.length < 3) draft.push(id);
  else return;
  paintDeck();
}

function saveDeck() {
  if (draft.length !== 3) return;
  SAVE.deck = [...draft];
  persist();
  enterLobby();
}

/* ---------------- rakip üretimi ---------------- */

/**
 * Rakip, oyuncunun destesiyle AYNI nadirlik dağılımını alır.
 * Böylece koleksiyon derinleştikçe denge kaymıyor — güçlü kart toplamak
 * seni güçlendiriyor ama karşına da benzer güçte biri çıkıyor.
 * Elementleri rastgele: eşleşme çeşitliliği kalsın.
 */
function makeFoe() {
  const rarities = deckChampions().map((c) => c.rarity);
  const els = shuffle(Object.keys(ELEMENTS));
  const shape = [els[0], els[0], els[1]];   // iki elementli comp
  const used = new Set();

  const units = rarities.map((rarity, i) => {
    // 1) hedef element + doğru nadirlik
    let pool = CHAMPIONS.filter((c) => c.el === shape[i] && c.rarity === rarity && !used.has(c.id));
    // 2) yoksa NADİRLİĞİ koru, elementten vazgeç — güç eşitliği comp şeklinden önemli.
    //    (her elementte tek destansı var; üç destansılı desteye karşı aksi hâlde
    //     zayıf rakip çıkıyordu)
    if (!pool.length) pool = CHAMPIONS.filter((c) => c.rarity === rarity && !used.has(c.id));
    if (!pool.length) pool = CHAMPIONS.filter((c) => !used.has(c.id));
    const c = pickRandom(pool);
    used.add(c.id);
    return { id: 'a' + i, name: c.name, el: c.el, atk: c.atk };
  });

  return {
    name: pickRandom(FOE_NAMES),
    level: 8 + Math.floor(Math.random() * 33),
    rank: foeRankLabel(),
    units,
  };
}

let searchTimers = [];

function clearSearch() {
  searchTimers.forEach(clearTimeout);
  searchTimers.forEach(clearInterval);
  searchTimers = [];
}

function startSearch() {
  clearSearch();
  const txt = $('#searchText');
  txt.textContent = 'Rakip aranıyor…';
  txt.classList.remove('found');
  $('#searchTimer').textContent = '0.0s';
  show('scr-search');

  const t0 = performance.now();
  const tick = setInterval(() => {
    $('#searchTimer').textContent = ((performance.now() - t0) / 1000).toFixed(1) + 's';
  }, 100);
  searchTimers.push(tick);

  for (const [at, label] of SEARCH_STAGES) {
    searchTimers.push(setTimeout(() => (txt.textContent = label), at));
  }

  const dur = FAKE.searchMin + Math.random() * FAKE.searchJit;
  searchTimers.push(
    setTimeout(() => {
      clearInterval(tick);
      $('#searchTimer').textContent = (dur / 1000).toFixed(1) + 's';
      txt.textContent = 'Rakip bulundu!';
      txt.classList.add('found');
      searchTimers.push(setTimeout(() => enterVersus(makeFoe()), FAKE.foundHold));
    }, dur)
  );
}

/* ---------------- VS ekranı ---------------- */

function enterVersus(foe) {
  const squad = playerSquad();
  setAvatar('#vsMeAvatar', 'Sen', squad[0] && squad[0].el);
  $('#vsMeLevel').textContent = myLevel();
  $('#vsMeRank').innerHTML = (isPlaced() ? rankIcon(SAVE.tier, '13px') : '') + rankLabel();
  renderSquad('#vsMeTeam', squad);

  setAvatar('#vsFoeAvatar', foe.name, foe.units[0].el);
  $('#vsFoeName').textContent = foe.name;
  $('#vsFoeLevel').textContent = foe.level;
  $('#vsFoeRank').textContent = foe.rank;
  renderSquad('#vsFoeTeam', foe.units);

  show('scr-versus');
  searchTimers.push(setTimeout(() => enterBattle(foe), FAKE.versusHold));
}

/* ---------------- savaş ---------------- */

function enterBattle(foe) {
  // Zorluk rütbeden geliyor. aiRecall burada set ediliyor, startBattle'da değil:
  // denge simülasyonu kadranı kendi çevirebilsin diye.
  CFG.aiRecall = rankRecall();
  show('scr-battle');
  startBattle(foe, finishBattle);
}

async function finishBattle(winner) {
  const won = winner === 'player';
  if (won) SAVE.wins++; else SAVE.losses++;

  // Paket artık her galibiyette gelmiyor: Rune Coin ile alınıyor ve rütbe
  // atlayınca bedava geliyor. İkisi birden olsaydı coin'in bir anlamı kalmazdı.
  const r = applyMatchResult(won);

  await sleep(700); // son vuruş ekranda otursun

  /* Rütbe değiştiyse o anı oynat ve DOĞRUDAN lobiye dön.
   *
   * Animasyon zaten sonucu ve yeni rütbeyi gösteriyor; üstüne bir de sonuç
   * ekranı çıkarmak fazladan bir dokunuş oluyordu. Sonuç ekranındaki bilgi
   * kaybolmasın diye kazanılanlar animasyonun altına yazılıyor. */
  const rutbeDegisti = r.rankUps > 0 || r.dustu || r.placementDone;
  if (rutbeDegisti) {
    const not = [`+${r.coins} Rune Coin`]
      .concat(r.rankUps > 0 ? [`+${r.rankUps} bedava paket`] : [])
      .join('<br>');

    if (r.rankUps > 0)          await playRankFx('up', r.etiket, null, not);
    else if (r.dustu)           await playRankFx('down', r.etiket, null, not);
    else if (r.placementDone)   await playRankFx('up', r.etiket, 'YERLEŞTİN', not);

    enterLobby();
    return;
  }

  $('#overTitle').textContent = won ? 'Kazandın' : 'Kaybettin';
  $('#overTitle').style.color = won ? '#9ff0c4' : '#ffb0a0';
  $('#overSub').innerHTML =
    `<b>${S.foe.name}</b> · ${S.foe.rank} · Sv ${S.foe.level}<br>` +
    `${S.round}. tahtada bitti · Sicilin ${SAVE.wins}G ${SAVE.losses}M`;

  const satir = [`<span class="rw-coin">+${r.coins} Rune Coin</span>`];

  if (r.placement) {
    satir.push(r.placementDone
      ? `<span class="rw-up">Yerleştirme bitti · <b>${r.etiket}</b></span>`
      : `<span class="rw-lp">Yerleştirme ${SAVE.placeGames}/${PLACEMENT_GAMES}</span>`);
  } else {
    satir.push(`<span class="rw-lp">${r.lp > 0 ? '+' : ''}${r.lp} LP · ${r.etiket} ${SAVE.lp} LP</span>`);
    if (r.rankUps > 0) {
      satir.push(`<span class="rw-up">Rütbe atladın — <b>${r.etiket}</b></span>`);
      satir.push(`<span class="rw-up">+${r.rankUps} bedava paket</span>`);
    }
    if (r.dustu) satir.push(`<span class="rw-down">Rütbe düştün — ${r.etiket}</span>`);
  }

  $('#overRewards').innerHTML = satir.join('');
  $('#overlay').hidden = false;
}

/* ---------------- rütbe değişimi anı ---------------- */

/**
 * Tam ekran rütbe animasyonu. Vurgu amblemin KENDİSİNDEN çıkan ışıkla
 * yapılıyor — saçılan parçacıklarla değil; kartlarda da aynı tercih var.
 *
 * Süre CFG.spellTravel gibi ayarlanabilir bir yerde değil çünkü maç içinde
 * değil: fastMode simülasyonu buraya hiç uğramıyor (finishBattle DOM işidir).
 */
async function playRankFx(yon, etiket, kelime, not = '') {
  const t = TIERS[SAVE.tier];
  const fx = $('#rankFx');

  $('#rfxEmblem').innerHTML = rankIcon(SAVE.tier, '100%');
  $('#rfxWord').textContent = kelime || (yon === 'up' ? 'RÜTBE ATLADIN' : 'RÜTBE DÜŞTÜN');
  $('#rfxRank').textContent = etiket;
  $('#rfxNote').innerHTML = not;
  fx.style.setProperty('--rc', t.color);
  fx.className = yon;            // .up / .down — animasyonları ayrı
  fx.hidden = false;

  // Sonuç ekranı artık arkasından gelmiyor, tek gösterilen bu — okunacak
  // kadar dursun (kazanılan coin ve paket de burada yazıyor).
  await sleep(yon === 'up' ? 2600 : 2200);
  fx.hidden = true;
  fx.className = '';
}

/* ---------------- paket satın alma ---------------- */

let buyQty = 1;

function openBuySheet() {
  buyQty = 1;
  $('#packPrice').textContent = PACK_PRICE;
  renderBuySheet();
  $('#buySheet').hidden = false;
}

function renderBuySheet() {
  const max = affordablePacks();
  // Parası hiç yetmese bile 1 gösteriliyor: fiyatı ve ne kadar eksiği olduğunu
  // görsün. Sıfır gösterip tuşu kilitlemek sebebi söylemiyor.
  const ustSinir = Math.max(1, max);
  buyQty = Math.max(1, Math.min(buyQty, ustSinir));

  const tutar = buyQty * PACK_PRICE;
  const yetiyor = tutar <= SAVE.coins;

  $('#qtyVal').textContent = buyQty;
  $('#qtyMinus').disabled = buyQty <= 1;
  $('#qtyPlus').disabled = buyQty >= ustSinir;
  $('#qtyMax').hidden = max <= 1 || buyQty === max;

  $('#buyTotal').classList.toggle('eksik', !yetiyor);
  $('#buyTotal').innerHTML =
    `<b>${tutar}</b> / ${SAVE.coins} Rune Coin` +
    `<span class="sheet-note">${yetiyor
      ? `kalan: ${SAVE.coins - tutar}`
      : `${tutar - SAVE.coins} Rune Coin daha lazım`}</span>`;

  $('#buyConfirm').disabled = !yetiyor;
  $('#buyConfirm').textContent = yetiyor ? 'SATIN AL' : 'YETERLİ COIN YOK';
}

/* ---------------- bağlantılar ---------------- */

$('#findBtn').addEventListener('click', startSearch);
$('#cancelBtn').addEventListener('click', enterLobby);
$('#leaveBtn').addEventListener('click', enterLobby);
$('#lobbyBtn').addEventListener('click', enterLobby);
$('#deckBtn').addEventListener('click', enterDeck);
$('#openPackBtn').addEventListener('click', () => {
  if (SAVE.packs <= 0) return;
  SAVE.packs--;
  persist();
  enterPack(false);
});
$('#againBtn').addEventListener('click', () => {
  $('#overlay').hidden = true;
  startSearch();
});

$('#buyPackBtn').addEventListener('click', openBuySheet);
$('#qtyMinus').addEventListener('click', () => { buyQty--; renderBuySheet(); });
$('#qtyPlus').addEventListener('click', () => { buyQty++; renderBuySheet(); });
$('#qtyMax').addEventListener('click', () => { buyQty = affordablePacks(); renderBuySheet(); });
$('#buyCancel').addEventListener('click', () => { $('#buySheet').hidden = true; });
$('#synClose').addEventListener('click', () => { $('#synSheet').hidden = true; });
$('#synSheet').addEventListener('click', (e) => {
  // dışına dokun, kapan — ama açılış tıklamasının kendisiyle değil
  if (e.target.id === 'synSheet' && synKapanabilir()) $('#synSheet').hidden = true;
});
$('#buyConfirm').addEventListener('click', () => {
  const alinan = buyPacks(buyQty);
  $('#buySheet').hidden = true;
  if (!alinan) return;
  enterLobby();          // cüzdan ve paket rozeti tazelensin
  SAVE.packs--;          // ilki hemen açılıyor, kalanlar rozette birikiyor
  persist();
  enterPack(false);
});

// Kaydı sıfırla — prototipte ilk açılış deneyimini tekrar tekrar görmek gerekiyor.
// İki dokunuş: yanlışlıkla basılmasın, ama diyalog kutusu da açmasın.
let resetArmed = null;
$('#resetBtn').addEventListener('click', (e) => {
  const b = e.currentTarget;
  if (!resetArmed) {
    b.textContent = 'emin misin? tekrar dokun';
    b.classList.add('armed');
    resetArmed = setTimeout(() => {
      resetArmed = null;
      b.textContent = 'kaydı sıfırla';
      b.classList.remove('armed');
    }, 3000);
    return;
  }
  clearTimeout(resetArmed);
  try { localStorage.removeItem(SAVE_KEY); } catch {}
  location.reload();
});

/* ---------------- görsel geçersiz kılma ---------------- */

/**
 * `src/assets/icons/<ad>.svg` varsa koddaki çizimin yerine geçer.
 *
 * Kullanıcı kendi tasarımını dosyaya koyup sayfayı yeniliyor — kod değişikliği
 * gerekmiyor. Dosya yoksa ya da içi bozuksa koddaki çizim kalıyor, yani hiçbir
 * durumda ikon kaybolmuyor.
 *
 * SVG bütün olarak değiştiriliyor: kullanıcının kendi viewBox'ı ve çizgi
 * kalınlığı geçerli oluyor. Renk vermemesi yeterli — `currentColor` sayesinde
 * aynı çizim altı elementte de, altın amblemde de doğru renkte çıkıyor.
 */
async function loadIcons() {
  const slots = [
    ...Object.keys(ICON_SVG).map((el) => [el, (svg) => (ICON_SVG[el] = svg)]),
    ['mark',      (svg) => (MARK_SVG = svg)],
    ['ui-deck',   (svg) => (ICON_DECK = svg)],
    ['ui-pack',   (svg) => (ICON_PACK = svg)],
    ['ui-coin',   (svg) => (ICON_COIN = svg)],
    // rütbe amblemleri: assets/icons/rank-<kademe>.svg
    ...TIERS.map((t) => [`rank-${t.key}`, (svg) => (RANK_SVG[t.key] = svg)]),
    ['rune-mark', (svg) => (CARD_BACK_SVG = svg)],
  ];

  // en az bir <svg> ve içinde bir çizim olsun — boş/bozuk dosya ikonu silmesin
  const gecerli = (t) => /<svg[\s>]/i.test(t) &&
    /<(path|circle|rect|polyline|polygon|line|ellipse|g)[\s>]/i.test(t);

  await Promise.all(
    slots.map(async ([name, apply]) => {
      // Tek dosyalık yapımda ikonlar sayfaya gömülü geliyor (tools-build-single.js),
      // istek atılacak bir sunucu yok. Gömülü yoksa dosyadan okumaya devam.
      const gomulu = window.__ICONS && window.__ICONS[name];
      if (gomulu) { if (gecerli(gomulu)) apply(gomulu); return; }

      try {
        const r = await fetch(`assets/icons/${name}.svg`, { cache: 'no-store' });
        if (!r.ok) return;
        const txt = (await r.text()).trim();
        if (gecerli(txt)) apply(txt);
      } catch { /* dosya yok: koddaki çizim kalsın */ }
    })
  );
}

/* ---------------- açılış ---------------- */

(async () => {
  await loadIcons();
  showLoading(() => {
    if (!SAVE.introDone || ownedIds().length === 0) enterPack(true);   // başlangıç serisi
    else enterLobby();
  });
})();

</script>
